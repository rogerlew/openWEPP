# Defaults for new trusted sessions; running sessions and explicit overrides are unchanged.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.rust_code_reviewer]
description = "Primary correctness gate for Rust authoring/modification tasks."
config_file = "agents/rust_code_reviewer.toml"

[agents.rust_qa_reviewer]
description = "Secondary QA gate for Rust quality, tests, and maintainability."
config_file = "agents/rust_qa_reviewer.toml"

[agents.comparator_suite_runner]
description = "Runs context-heavy batch and comparison work, including tools/owcmp suites, on gpt-5.3-codex-spark and returns compact metrics plus artifact paths."
config_file = "agents/comparator_suite_runner.toml"

[agents.package_verifier]
description = "Independent bounded package verification; assigned artifact writes only."
config_file = "agents/package_verifier.toml"

[agents.worker]
description = "Bounded simple edits with explicit ownership; no scientific design."
config_file = "agents/worker.toml"

[agents.implementer]
description = "Detailed package implementation and focused verification under Astra orchestration."
config_file = "agents/implementer.toml"

[agents.explorer]
description = "Read-only targeted source and evidence extraction."
config_file = "agents/explorer.toml"

[agents.science_advisor]
description = "Science/technical direction between packages, or a named in-package scientific blocker; cannot independently review its own design."
config_file = "agents/science_advisor.toml"
