[package]
name = "openwepp-hillslope-orchestrator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
openwepp-climate-runtime-adapter = { path = "../openwepp-climate-runtime-adapter", version = "0.1.0" }
openwepp-input-contract = { path = "../openwepp-input-contract", version = "0.1.0" }
openwepp-kernel-contract = { path = "../openwepp-kernel-contract", version = "0.1.0" }
openwepp-sim-contract = { path = "../openwepp-sim-contract", version = "0.1.0" }
openwepp-topology = { path = "../openwepp-topology", version = "0.1.0" }
openwepp-unit-boundary = { path = "../openwepp-unit-boundary", version = "0.1.0" }
