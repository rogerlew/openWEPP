[package]
name = "openwepp-hillslope-orchestrator"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
openwepp-sim-contract = { path = "../openwepp-sim-contract", version = "0.1.0" }
openwepp-topology = { path = "../openwepp-topology", version = "0.1.0" }

[workspace]
resolver = "2"
