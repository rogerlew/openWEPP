[package]
name = "openwepp-unit-boundary"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
