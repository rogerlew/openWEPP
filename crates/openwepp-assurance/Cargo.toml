[package]
name = "openwepp-assurance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Fail-closed source validation and zero-public-report tooling for openWEPP scientific assurance"

[lints]
workspace = true

[dependencies]
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[[bin]]
name = "openwepp-assurance"
path = "src/main.rs"
