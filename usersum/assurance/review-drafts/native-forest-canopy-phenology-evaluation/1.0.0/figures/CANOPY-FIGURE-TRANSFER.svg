<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 254">
  <title>Harvard independent timing-error range</title>
  <desc>Two bars show minimum Harvard aggregate error of 43.48 days and maximum error of 72.46 days.</desc>
  <defs>
    <pattern id="solid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d9d9d9"/></pattern>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="white"/><path d="M0,8 L8,0" stroke="#555" stroke-width="2"/></pattern>
  </defs>
  <rect width="900" height="254" fill="white"/>
  <text x="20" y="32" font-family="sans-serif" font-size="20">Harvard independent timing-error range</text>
  <text x="20" y="88" font-family="sans-serif" font-size="14">Minimum Harvard aggregate error</text>
  <rect x="300" y="70" width="300.007526" height="28" fill="url(#solid)" stroke="black"/>
  <text x="815" y="89" text-anchor="end" font-family="monospace" font-size="14">43.48 d</text>
  <text x="20" y="150" font-family="sans-serif" font-size="14">Maximum Harvard aggregate error</text>
  <rect x="300" y="132" width="500.000000" height="28" fill="url(#stripe)" stroke="black"/>
  <text x="815" y="151" text-anchor="end" font-family="monospace" font-size="14">72.46 d</text>
</svg>
