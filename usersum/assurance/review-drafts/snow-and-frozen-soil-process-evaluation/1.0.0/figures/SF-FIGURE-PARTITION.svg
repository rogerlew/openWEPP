<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 254">
  <title>Production precipitation-partition residual and allowance</title>
  <desc>The maximum residual is many orders of magnitude smaller than the declared allowance.</desc>
  <defs>
    <pattern id="solid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d9d9d9"/></pattern>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="white"/><path d="M0,8 L8,0" stroke="#555" stroke-width="2"/></pattern>
  </defs>
  <rect width="900" height="254" fill="white"/>
  <text x="20" y="32" font-family="sans-serif" font-size="20">Production precipitation-partition residual and allowance</text>
  <text x="20" y="88" font-family="sans-serif" font-size="14">Maximum precipitation-partition residual</text>
  <rect x="300" y="70" width="0.000278" height="28" fill="url(#solid)" stroke="black"/>
  <text x="815" y="89" text-anchor="end" font-family="monospace" font-size="14">5.55e-17 m</text>
  <text x="20" y="150" font-family="sans-serif" font-size="14">Precipitation-partition allowance</text>
  <rect x="300" y="132" width="500.000000" height="28" fill="url(#stripe)" stroke="black"/>
  <text x="815" y="151" text-anchor="end" font-family="monospace" font-size="14">1.0e-10 m</text>
</svg>
