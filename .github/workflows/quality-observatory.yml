name: quality-observatory

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact current main commit to observe"
        required: true
        type: string
      qualification_run_id:
        description: "Successful exact-head TESTGATE run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: openwepp-forest1-quality-observatory
  cancel-in-progress: false

jobs:
  priority-preflight:
    name: openwepp/quality-priority-preflight
    runs-on: ubuntu-24.04
    outputs:
      disposition: ${{ steps.occupancy.outputs.disposition }}
    steps:
      - name: Validate exact source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${QUALIFICATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${WORKFLOW_SHA}" = "${SOURCE_SHA}"
          [[ "${WORKFLOW_REF}" == "${GITHUB_REPOSITORY}/.github/workflows/quality-observatory.yml@refs/heads/main" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit current main and inspect TESTGATE priority
        id: occupancy
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          qualification="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}")"
          jq -e \
            --arg source_sha "${SOURCE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .head_sha == $source_sha and
              .head_branch == "main" and
              .path == ".github/workflows/testgate-shadow.yml" and
              .repository.full_name == $repository
            ' <<<"${qualification}"
          python3 tools/local_ci/quality_observatory_workflow.py preflight \
            --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/quality-control-receipt.json"
          disposition="$(jq -r '.disposition' \
            "${RUNNER_TEMP}/quality-control-receipt.json")"
          echo "disposition=${disposition}" >> "${GITHUB_OUTPUT}"
      - name: Upload typed preflight deferral
        if: ${{ steps.occupancy.outputs.disposition != 'READY' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-observatory-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-control-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  observe:
    name: openwepp/quality-observation
    needs: priority-preflight
    if: ${{ needs.priority-preflight.outputs.disposition == 'READY' }}
    runs-on: [self-hosted, Linux, X64, openwepp, forest1, trusted]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: /t
      QUALITY_HISTORY_ROOT: /testgate-history/quality-observatory
      # Keep TMPDIR descendants within Unix-domain socket path budgets while
      # retaining the attempt on disk-backed /testgate-history.
      QUALITY_ATTEMPT_ROOT: /testgate-history/q/${{ github.run_id }}-${{ github.run_attempt }}
      QUALITY_CONTROL_ROOT: /testgate-history/quality-observatory-control/${{ github.run_id }}-${{ github.run_attempt }}
      QUALITY_STAGING_ROOT: /testgate-history/quality-observatory-staging/${{ github.run_id }}-${{ github.run_attempt }}
      QUALITY_FOREST1_LEASE: /testgate-history/forest1-heavy.lock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact source before setup
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${WORKFLOW_SHA}" = "${SOURCE_SHA}"
          [[ "${WORKFLOW_REF}" == "${GITHUB_REPOSITORY}/.github/workflows/quality-observatory.yml@refs/heads/main" ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Run supervised observational collection
        id: observe
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${QUALITY_HISTORY_ROOT}"
          workflow_sha256="$(sha256sum \
            .github/workflows/quality-observatory.yml | awk '{print $1}')"
          export QUALITY_WORKFLOW_SHA256="${workflow_sha256}"
          set +e
          python3 tools/local_ci/quality_observatory_workflow.py supervise \
            --repo . \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --workflow-revision "${WORKFLOW_SHA}" \
            --workflow-sha256 "${workflow_sha256}" \
            --attempt-root "${QUALITY_ATTEMPT_ROOT}" \
            --control-root "${QUALITY_CONTROL_ROOT}" \
            --lease "${QUALITY_FOREST1_LEASE}" \
            -- \
            bash tools/local_ci/run_quality_observatory_child.sh
          supervisor_exit="$?"
          set -e
          if [[ -d "${QUALITY_ATTEMPT_ROOT}/published" ]]; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
          fi
          disposition="$(jq -r '.disposition // empty' \
            "${QUALITY_CONTROL_ROOT}/quality-control-receipt.json" 2>/dev/null || true)"
          priority_disposition="$(jq -r '.disposition // empty' \
            "${QUALITY_CONTROL_ROOT}/priority-stop.json" 2>/dev/null || true)"
          if [[ "${disposition}" == DEFERRED_* ]] || \
             [[ "${priority_disposition}" == DEFERRED_* ]]; then
            echo "deferred=true" >> "${GITHUB_OUTPUT}"
            printf 'quality control disposition: %s\n' \
              "${priority_disposition:-${disposition}}" \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "deferred=false" >> "${GITHUB_OUTPUT}"
          fi
          exit "${supervisor_exit}"
      - name: Upload complete quality observation
        if: ${{ steps.observe.outputs.complete == 'true' }}
        id: upload
        env:
          PUBLISHED: ${{ env.QUALITY_ATTEMPT_ROOT }}/published
          CONTROL: ${{ env.QUALITY_CONTROL_ROOT }}
        run: |
          set -euo pipefail
          python3 tools/local_ci/quality_observatory_workflow.py verify-upload \
            --published "${PUBLISHED}" \
            --control "${CONTROL}" \
            --staging "${QUALITY_STAGING_ROOT}" \
            --repository "${GITHUB_REPOSITORY}"
      - name: Publish complete quality observation
        if: ${{ steps.observe.outputs.complete == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-observatory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALITY_STAGING_ROOT }}
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Upload deferred or failed control evidence
        id: control
        if: ${{ always() && steps.observe.outputs.deferred != 'true' && steps.observe.outputs.complete != 'true' }}
        run: |
          set -euo pipefail
          python3 tools/local_ci/quality_observatory_workflow.py verify-control \
            --control "${QUALITY_CONTROL_ROOT}"
      - name: Publish control evidence
        if: ${{ always() && steps.control.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-observatory-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALITY_CONTROL_ROOT }}/quality-control-receipt.json
            ${{ env.QUALITY_CONTROL_ROOT }}/quality-partial-index.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Summarize observational result
        if: ${{ always() && steps.observe.outputs.deferred != 'true' }}
        run: |
          set -euo pipefail
          if [[ -f "${QUALITY_CONTROL_ROOT}/quality-control-receipt.json" ]] && \
             [[ "$(jq -r '.disposition' "${QUALITY_CONTROL_ROOT}/quality-control-receipt.json")" != "COMPLETE" ]]; then
            jq -r '"quality control disposition: \(.disposition)"' \
              "${QUALITY_CONTROL_ROOT}/quality-control-receipt.json" \
              >> "${GITHUB_STEP_SUMMARY}"
          elif [[ -f "${QUALITY_ATTEMPT_ROOT}/published/run-status.json" ]]; then
            jq -r '"quality evidence: \(.quality_evidence_id)\nexecution: \(.execution_integrity)\ndebt: \(.debt_status)\nclosure eligible: \(.closure_eligible)"' \
              "${QUALITY_ATTEMPT_ROOT}/published/run-status.json" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi
