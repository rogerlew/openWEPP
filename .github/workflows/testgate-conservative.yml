name: testgate-conservative

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Correctness comparison base (blank uses the commit parent)"
        required: false
        default: ""
        type: string
      smoke_only:
        description: "Prove hosted rollback admission without running broad validation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: openwepp-conservative-testgate
  cancel-in-progress: false

jobs:
  conservative-rollback:
    name: openwepp/conservative-rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit trusted main comparison
        id: comparison
        env:
          INPUT_BASE: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          base_ref="${INPUT_BASE:-${GITHUB_SHA}^}"
          base_commit="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          git merge-base --is-ancestor "${base_commit}" "${GITHUB_SHA}"
          [[ "${base_commit}" != "${GITHUB_SHA}" ]]
          echo "base=${base_commit}" >> "${GITHUB_OUTPUT}"
      - name: Prove hosted rollback smoke
        if: ${{ inputs.smoke_only }}
        env:
          EXPECTED_BASE: ${{ steps.comparison.outputs.base }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_BASE}" "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          bash -n tools/release/run_release_candidate_gates.sh
          bash -n tools/release/check_assurance_dossier_exports.sh
          jq -n \
            --arg base "${EXPECTED_BASE}" \
            --arg head "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runner_environment "${RUNNER_ENVIRONMENT}" \
            '{schema_version:"openwepp-conservative-smoke-v1",
              mode:"ADMISSION_SMOKE", result:"PASS",
              qualification_claim:false, repository:$repository,
              base_commit:$base, head_commit:$head,
              runner_environment:$runner_environment}' \
            > "${RUNNER_TEMP}/testgate-conservative-smoke.json"
          jq -e \
            '.result == "PASS" and .qualification_claim == false
             and .runner_environment == "github-hosted"' \
            "${RUNNER_TEMP}/testgate-conservative-smoke.json"
      - name: Upload rollback smoke receipt
        if: ${{ inputs.smoke_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conservative-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-conservative-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned conservative toolchain
        if: ${{ !inputs.smoke_only }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
          cargo install cargo-nextest --locked --version 0.9.138
          cargo install cargo-deny --locked --version 0.19.6
          python3 -m venv .venv
          .venv/bin/pip install --requirement tools/owcmp/requirements.lock.txt
      - name: Install pinned spelling converter
        if: ${{ !inputs.smoke_only }}
        env:
          UK2US_ROOT: ${{ runner.temp }}/uk2us
        run: |
          set -euo pipefail
          php --version | grep -F 'PHP 8.3.'
          python --version | grep -F 'Python 3.'
          git clone --filter=blob:none https://github.com/rogerlew/uk2us "${UK2US_ROOT}"
          git -C "${UK2US_ROOT}" checkout --detach 6ce03a96a9466bed029fb0287786cd903f1876d6
          test "$(git -C "${UK2US_ROOT}" rev-parse HEAD)" = 6ce03a96a9466bed029fb0287786cd903f1876d6
          echo '634e90ef3713a9910d165a6d93eeabcbe009a7bd402ef0a1e1cfe5d4f944356b  uk2us' \
            | (cd "${UK2US_ROOT}" && sha256sum --check --strict)
          echo 'c60e0d899f00e9faf2b8b8d3d71d0a735e8faa0fe96466ecd6619193eeaa425a  tools/ci/omarchy-runner/uk2us_rules.json' \
            | sha256sum --check --strict
          echo "${UK2US_ROOT}" >> "${GITHUB_PATH}"
          echo "UK2US_RULES_FILE=${GITHUB_WORKSPACE}/tools/ci/omarchy-runner/uk2us_rules.json" \
            >> "${GITHUB_ENV}"
      - name: Run conservative validation with required authority
        if: ${{ !inputs.smoke_only }}
        run: >-
          bash tools/release/run_release_candidate_gates.sh
          --mode validate
          --skip-stability
