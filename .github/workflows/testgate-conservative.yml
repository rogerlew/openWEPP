name: testgate-conservative

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "CRAP comparison base (blank uses the commit parent)"
        required: false
        default: ""
        type: string
      testgate_run_id:
        description: "Successful exact-candidate TESTGATE run whose global CRAP evidence may be reused"
        required: false
        default: ""
        type: string
      testgate_run_attempt:
        description: "Attempt number for the reusable TESTGATE run"
        required: false
        default: 1
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: openwepp-conservative-testgate
  cancel-in-progress: false

jobs:
  conservative-rollback:
    name: openwepp/conservative-rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit trusted main comparison
        id: comparison
        env:
          INPUT_BASE: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          base_ref="${INPUT_BASE:-${GITHUB_SHA}^}"
          base_commit="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          git merge-base --is-ancestor "${base_commit}" "${GITHUB_SHA}"
          [[ "${base_commit}" != "${GITHUB_SHA}" ]]
          echo "base=${base_commit}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned conservative toolchain
        env:
          TESTGATE_RUN_ID: ${{ inputs.testgate_run_id }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
          cargo install cargo-nextest --locked --version 0.9.138
          cargo install cargo-deny --locked --version 0.19.6
          python3 -m venv .venv
          .venv/bin/pip install --requirement tools/owcmp/requirements.lock.txt
          if [[ -z "${TESTGATE_RUN_ID}" ]]; then
            cargo install cargo-llvm-cov --locked --version 0.8.7
            cargo install cargo-crap --locked --version 0.2.2
          fi
      - name: Install pinned spelling converter
        env:
          UK2US_ROOT: ${{ runner.temp }}/uk2us
        run: |
          set -euo pipefail
          php --version | grep -F 'PHP 8.3.'
          python --version | grep -F 'Python 3.'
          git clone --filter=blob:none https://github.com/rogerlew/uk2us "${UK2US_ROOT}"
          git -C "${UK2US_ROOT}" checkout --detach 6ce03a96a9466bed029fb0287786cd903f1876d6
          test "$(git -C "${UK2US_ROOT}" rev-parse HEAD)" = 6ce03a96a9466bed029fb0287786cd903f1876d6
          echo '634e90ef3713a9910d165a6d93eeabcbe009a7bd402ef0a1e1cfe5d4f944356b  uk2us' \
            | (cd "${UK2US_ROOT}" && sha256sum --check --strict)
          echo 'c60e0d899f00e9faf2b8b8d3d71d0a735e8faa0fe96466ecd6619193eeaa425a  tools/ci/omarchy-runner/uk2us_rules.json' \
            | sha256sum --check --strict
          echo "${UK2US_ROOT}" >> "${GITHUB_PATH}"
          echo "UK2US_RULES_FILE=${GITHUB_WORKSPACE}/tools/ci/omarchy-runner/uk2us_rules.json" \
            >> "${GITHUB_ENV}"
      - name: Download authenticated TESTGATE evidence for CRAP reuse
        if: ${{ inputs.testgate_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testgate-${{ inputs.testgate_run_id }}-${{ inputs.testgate_run_attempt }}
          path: ${{ runner.temp }}/testgate-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testgate_run_id }}
      - name: Verify exact authenticated global CRAP evidence
        if: ${{ inputs.testgate_run_id != '' }}
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-evidence
          EXPECTED_BASE: ${{ steps.comparison.outputs.base }}
          SOURCE_RUN_ID: ${{ inputs.testgate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            | jq -e --arg head "${GITHUB_SHA}" \
              '.conclusion == "success" and .head_sha == $head'
          gh attestation verify "${EVIDENCE_DIR}/receipt.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/testgate-shadow.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type https://openwepp.org/attestations/testgate/v1 \
            --deny-self-hosted-runners \
            --bundle "${EVIDENCE_DIR}/github-attestation.jsonl" \
            --format json > "${RUNNER_TEMP}/crap-reuse-attestation.json"
          jq -e 'length == 1' "${RUNNER_TEMP}/crap-reuse-attestation.json"
          crap_node_id="$(jq -er \
            '.nodes | map(select(.gate_definition_id == "adjudicated-crap-v1"))
             | if length == 1 then .[0].node_id else error("global CRAP node missing or duplicated") end' \
            "${EVIDENCE_DIR}/terminal-plan.json")"
          jq -e \
            --arg base "${EXPECTED_BASE}" \
            --arg head "${GITHUB_SHA}" \
            --arg node "${crap_node_id}" \
            '.result == "PASS"
             and .source.base_commit == $base
             and .source.head_commit == $head
             and any(.attempts[]; .node_id == $node and .result == "PASS" and .exit_code == 0)' \
            "${EVIDENCE_DIR}/receipt.json"
          report_path=target/gate-plan/adjudicated-crap.json
          expected_sha="$(jq -er \
            --arg path "${report_path}" \
            '.artifacts | map(select(.path == $path))
             | if length == 1 then .[0].sha256 else error("global CRAP artifact missing or duplicated") end' \
            "${EVIDENCE_DIR}/receipt.json")"
          echo "${expected_sha}  ${EVIDENCE_DIR}/execution/${report_path}" \
            | sha256sum --check --strict
          jq -e \
            '.status == "PASS"
             and .measurement_scope == "GLOBAL_WORKSPACE"
             and .closure_eligible == true
             and .raw_over_threshold_count == 0
             and .adjudicated_count == 0
             and .actionable_count == 0' \
            "${EVIDENCE_DIR}/execution/${report_path}"
      - name: Run conservative validation with required authority
        if: ${{ inputs.testgate_run_id == '' }}
        env:
          CRAP_BASE_REF: ${{ steps.comparison.outputs.base }}
        run: >-
          bash tools/release/run_release_candidate_gates.sh
          --mode validate
          --skip-stability
          --crap-base-ref "${CRAP_BASE_REF}"
      - name: Run conservative comparison with reused global CRAP
        if: ${{ inputs.testgate_run_id != '' }}
        run: |
          set -euo pipefail
          bash tools/release/check_assurance_dossier_exports.sh
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace --profile full
          cargo deny check
          .venv/bin/python -m unittest -v tests.python.test_adjudicated_crap_gate
          bash tools/release/run_release_candidate_gates.sh \
            --mode validate \
            --skip-stability \
            --authority-only
