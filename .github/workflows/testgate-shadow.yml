name: testgate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Comparison base (blank uses the commit parent)"
        required: false
        default: ""
        type: string
      combined_quality_proof_id:
        description: "Repository-pinned combined quality proof ID (blank keeps separate gates)"
        required: false
        default: ""
        type: string
      intent_package:
        description: "Prospective intent package anchor"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openwepp-forest1-testgate
  queue: single
  cancel-in-progress: false

jobs:
  execute-increment:
    name: openwepp/execute-increment
    runs-on: [self-hosted, Linux, X64, openwepp, forest1, trusted]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      OPENWEPP_RUNNER_IMAGE_ID: sha256:8a551a87d0784a74be1a76452beb1e4e6726cc36135722020e20a042e04bae84
      CARGO_TARGET_DIR: /t
      TESTGATE_EXECUTION_ROOT: /t
      TESTGATE_HISTORY_ROOT: /testgate-history
      OPENWEPP_GATE_CHECKPOINT_MIRROR_ROOT: /testgate-history/recovery/${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit trusted main comparison
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_ref }}
          INPUT_INTENT_PACKAGE: ${{ inputs.intent_package }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          base_ref="${INPUT_BASE}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            base_ref="${EVENT_BEFORE}"
          fi
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref="${GITHUB_SHA}^"
          fi
          base_commit="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          head_commit="$(git rev-parse --verify --end-of-options "${GITHUB_SHA}^{commit}")"
          current_head="$(git rev-parse --verify refs/remotes/origin/main)"
          if [[ "${head_commit}" != "${current_head}" ]]; then
            echo "ERROR: superseded TESTGATE head ${head_commit}; current main is ${current_head}" >&2
            exit 1
          fi
          git merge-base --is-ancestor "${base_commit}" "${head_commit}"
          [[ "${base_commit}" != "${head_commit}" ]]
          intent_package="$(python3 tools/local_ci/resolve_testgate_intent_package.py \
            --repo . \
            --event-name "${EVENT_NAME}" \
            --head "${head_commit}" \
            --input-package "${INPUT_INTENT_PACKAGE}")"
          {
            echo "base=${base_commit}"
            echo "head=${head_commit}"
            echo "intent_package=${intent_package}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify pinned gate toolchain
        run: |
          set -euo pipefail
          test "$(gh --version | awk 'NR == 1 { print $3 }')" = '2.96.0'
          rustc --version | grep -F 'rustc 1.92.0'
          cargo nextest --version | grep -F 'cargo-nextest 0.9.138'
          cargo deny --version | grep -F 'cargo-deny 0.19.6'
          cargo llvm-cov --version | grep -F 'cargo-llvm-cov 0.8.7'
          cargo crap --version | grep -F 'cargo-crap 0.2.2'
          rustup component list --installed | grep -F 'llvm-tools-'
          rg --version | grep -F 'ripgrep 14.1.0'
          markdown-doc --version
          php --version | grep -F 'PHP 8.3.'
          uk2us --help >/dev/null
          python --version | grep -F 'Python 3.12.'
          python3 -c 'import pandas, pyarrow; assert pandas.__version__ == "3.0.3"; assert pyarrow.__version__ == "22.0.0"'
          python3 -m venv --help >/dev/null
      - name: Bootstrap locked base and head dependencies
        run: >-
          bash tools/ci/omarchy-runner/bootstrap_dependencies.sh
          "${{ steps.comparison.outputs.base }}"
          "${{ steps.comparison.outputs.head }}"
      - name: Build planner and executor
        run: cargo build --locked -p openwepp-gate-planner --bin openwepp-gate-plan
      - name: Restore and verify newest durable attempt history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${TESTGATE_HISTORY_ROOT}"
          chmod 700 "${TESTGATE_HISTORY_ROOT}"
          history="${TESTGATE_HISTORY_ROOT}/attempts.jsonl"
          restore_history=false
          if [[ ! -s "${history}" ]]; then
            restore_history=true
          fi
          artifact_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("testgate-recovery-verified-")) | select(.workflow_run.head_branch == "main")] | sort_by(.created_at) | last // empty')"
            artifact_url="$(jq -r '.archive_download_url // empty' <<<"${artifact_json}")"
            if [[ -n "${artifact_url}" ]]; then
              restored_run_id="$(jq -r '.workflow_run.id' <<<"${artifact_json}")"
              restored_attempt="$(jq -r '.name | split("-") | last' <<<"${artifact_json}")"
              restored_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${restored_run_id}")"
              [[ "$(jq -r '.path' <<<"${restored_run_json}")" == ".github/workflows/testgate-shadow.yml" ]]
              [[ "$(jq -r '.head_repository.full_name' <<<"${restored_run_json}")" == "${GITHUB_REPOSITORY}" ]]
              [[ "$(jq -r '.name' <<<"${artifact_json}")" == "testgate-recovery-verified-${restored_run_id}-${restored_attempt}" ]]
              restore_root="${TESTGATE_EXECUTION_ROOT}/history-restore"
              mkdir "${restore_root}"
              gh api "${artifact_url}" > "${restore_root}/history.zip"
              unzip -q "${restore_root}/history.zip" -d "${restore_root}/package"
              evidence="${restore_root}/package/unsigned"
              auth="${restore_root}/package/auth"
              index_sha="$(sha256sum "${evidence}/attempt-index.json" | cut -d' ' -f1)"
              jq -e \
                --arg index_sha256 "${index_sha}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg workflow "${GITHUB_WORKFLOW}" \
                --arg run_id "${restored_run_id}" \
                --arg run_attempt "${restored_attempt}" \
                --arg head_sha "$(jq -r '.workflow_run.head_sha' <<<"${artifact_json}")" \
                '.schema_version == "openwepp-testgate-recovery-provenance-v1"
                 and .index_sha256 == $index_sha256
                 and .repository == $repository
                 and .workflow == $workflow
                 and .source_ref == "refs/heads/main"
                 and .run_id == $run_id
                 and .run_attempt == $run_attempt
                 and .head_sha == $head_sha' \
                "${auth}/recovery-predicate.json"
              gh attestation verify "${evidence}/attempt-index.json" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/testgate-shadow.yml" \
                --source-ref refs/heads/main \
                --source-digest "$(jq -r '.workflow_run.head_sha' <<<"${artifact_json}")" \
                --predicate-type https://openwepp.org/attestations/testgate-recovery/v1 \
                --deny-self-hosted-runners \
                --bundle "${auth}/recovery-attestation.jsonl" \
                --format json > "${restore_root}/attestation-verification.json"
              jq -e 'length == 1' "${restore_root}/attestation-verification.json"
              EVIDENCE_DIR="${evidence}" AUTH_DIR="${auth}" \
              HISTORY_ROOT="${TESTGATE_HISTORY_ROOT}" \
              RESTORE_HISTORY="${restore_history}" \
              EXPECTED_REPOSITORY="${GITHUB_REPOSITORY}" \
              EXPECTED_WORKFLOW="${GITHUB_WORKFLOW}" \
              EXPECTED_RUN_ID="${restored_run_id}" \
              EXPECTED_RUN_ATTEMPT="${restored_attempt}" \
              EXPECTED_HEAD_SHA="$(jq -r '.workflow_run.head_sha' <<<"${artifact_json}")" \
              python3 - <<'PY'
          import os
          from pathlib import Path

          from tools.local_ci.testgate import (
              _install_recovery_provenance,
              _restore_attempt_archive,
              _verify_attempt_archive,
          )

          root = Path(os.environ["EVIDENCE_DIR"])
          _verify_attempt_archive(
              root,
              repository=os.environ["EXPECTED_REPOSITORY"],
              workflow=os.environ["EXPECTED_WORKFLOW"],
              run_id=os.environ["EXPECTED_RUN_ID"],
              run_attempt=os.environ["EXPECTED_RUN_ATTEMPT"],
              head_sha=os.environ["EXPECTED_HEAD_SHA"],
          )
          history = Path(os.environ["HISTORY_ROOT"])
          if os.environ["RESTORE_HISTORY"] == "true":
              _restore_attempt_archive(root, history)
          _install_recovery_provenance(root, Path(os.environ["AUTH_DIR"]), history)
          PY
            fi
          touch "${history}"
      - name: Reject superseded head before gate execution
        env:
          EXPECTED_HEAD: ${{ steps.comparison.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_head="$(git rev-parse --verify refs/remotes/origin/main)"
          if [[ "${EXPECTED_HEAD}" != "${current_head}" ]]; then
            echo "ERROR: superseded TESTGATE head ${EXPECTED_HEAD}; current main is ${current_head}" >&2
            exit 1
          fi
      - name: Execute content-verifiable increment gates
        id: testgate
        env:
          COMBINED_PROOF_ID: ${{ inputs.combined_quality_proof_id }}
        run: |
          set -euo pipefail
          evidence_dir="${TESTGATE_EXECUTION_ROOT}/e"
          planner_tmp="${TESTGATE_EXECUTION_ROOT}/p"
          orchestration_log="${evidence_dir}/orchestration-error.log"
          [[ ! -e "${planner_tmp}" && ! -e "${evidence_dir}" ]]
          mkdir "${planner_tmp}" "${evidence_dir}"
          set +e
          combined_args=()
          if [[ -n "${COMBINED_PROOF_ID}" ]]; then
            combined_args=(--combined-proof-id "${COMBINED_PROOF_ID}")
          fi
          TMPDIR="${planner_tmp}" python3 tools/local_ci/testgate.py \
            --binary "${CARGO_TARGET_DIR}/debug/openwepp-gate-plan" \
            --base "${{ steps.comparison.outputs.base }}" \
            --head "${{ steps.comparison.outputs.head }}" \
            --intent-package "${{ steps.comparison.outputs.intent_package }}" \
            --boundary INCREMENT \
            --artifact-root "${evidence_dir}" \
            --history-ledger "${TESTGATE_HISTORY_ROOT}/attempts.jsonl" \
            --job openwepp/execute-increment \
            "${combined_args[@]}" \
            --execute 2>"${orchestration_log}"
          testgate_status=$?
          set -e
          if [[ "${testgate_status}" -ne 0 ]]; then
            cat "${orchestration_log}" >&2
            exit "${testgate_status}"
          fi
          echo "evidence_dir=${evidence_dir}" >> "${GITHUB_OUTPUT}"
      - name: Finalize pre-receipt recovery evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          evidence_dir="${TESTGATE_EXECUTION_ROOT}/e"
          mkdir -p "${evidence_dir}"
          if [[ -x "${CARGO_TARGET_DIR}/debug/openwepp-gate-plan" ]]; then
            "${CARGO_TARGET_DIR}/debug/openwepp-gate-plan" reconcile-attempts \
              --ledger "${TESTGATE_HISTORY_ROOT}/attempts.jsonl"
          fi
          EVIDENCE_DIR="${evidence_dir}" HISTORY_LEDGER="${TESTGATE_HISTORY_ROOT}/attempts.jsonl" python3 - <<'PY'
          import os
          from pathlib import Path

          from tools.local_ci.testgate import _snapshot_history, _write_attempt_index

          evidence = Path(os.environ["EVIDENCE_DIR"])
          _snapshot_history(Path(os.environ["HISTORY_LEDGER"]), evidence)
          _write_attempt_index(evidence)
          PY
      - name: Upload unsigned execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testgate-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TESTGATE_EXECUTION_ROOT }}/e
          if-no-files-found: error
          retention-days: 30

  verify-increment:
    name: openwepp/verify-increment
    needs: execute-increment
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download unsigned execution evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testgate-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-recovery-package/unsigned
      - name: Checkout exact source for independent verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-ingest exact durable attempt archive
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-recovery-package/unsigned
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${EVIDENCE_DIR}" python3 - <<'PY'
          import os
          from pathlib import Path

          from tools.local_ci.testgate import _verify_attempt_archive

          _verify_attempt_archive(
              Path(os.environ["EVIDENCE_DIR"]),
              repository=os.environ["GITHUB_REPOSITORY"],
              workflow=os.environ["GITHUB_WORKFLOW"],
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              head_sha=os.environ["GITHUB_SHA"],
          )
          PY
      - name: Build recovery provenance predicate
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-recovery-package/unsigned
          AUTH_DIR: ${{ runner.temp }}/testgate-recovery-package/auth
        run: |
          set -euo pipefail
          mkdir "${AUTH_DIR}"
          index_sha="$(sha256sum "${EVIDENCE_DIR}/attempt-index.json" | cut -d' ' -f1)"
          jq -n \
            --arg index_sha256 "${index_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg head_sha "${GITHUB_SHA}" \
            '{schema_version:"openwepp-testgate-recovery-provenance-v1", index_sha256:$index_sha256, repository:$repository, workflow:$workflow, source_ref:$source_ref, run_id:$run_id, run_attempt:$run_attempt, head_sha:$head_sha}' \
            > "${AUTH_DIR}/recovery-predicate.json"
      - name: Authenticate exact recovery archive index
        id: attest-recovery
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/testgate-recovery-package/unsigned/attempt-index.json
          predicate-type: https://openwepp.org/attestations/testgate-recovery/v1
          predicate-path: ${{ runner.temp }}/testgate-recovery-package/auth/recovery-predicate.json
      - name: Verify recovery attestation before publication
        env:
          AUTH_DIR: ${{ runner.temp }}/testgate-recovery-package/auth
          INDEX_PATH: ${{ runner.temp }}/testgate-recovery-package/unsigned/attempt-index.json
          BUNDLE_PATH: ${{ steps.attest-recovery.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -- "${BUNDLE_PATH}" "${AUTH_DIR}/recovery-attestation.jsonl"
          gh attestation verify "${INDEX_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/testgate-shadow.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type https://openwepp.org/attestations/testgate-recovery/v1 \
            --deny-self-hosted-runners \
            --bundle "${AUTH_DIR}/recovery-attestation.jsonl" \
            --format json > "${AUTH_DIR}/recovery-verification.json"
          jq -e 'length == 1' "${AUTH_DIR}/recovery-verification.json"
      - name: Upload authenticated recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testgate-recovery-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-recovery-package
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when execution did not succeed
        env:
          EXECUTION_RESULT: ${{ needs.execute-increment.result }}
        run: test "${EXECUTION_RESULT}" = success
      - name: Independently admit comparison base
        id: verification-comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          current_head="$(git rev-parse --verify refs/remotes/origin/main)"
          if [[ "${GITHUB_SHA}" != "${current_head}" ]]; then
            echo "ERROR: refusing to verify superseded head ${GITHUB_SHA}; current main is ${current_head}" >&2
            exit 1
          fi
          base_ref="${INPUT_BASE}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            base_ref="${EVENT_BEFORE}"
          fi
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref="${GITHUB_SHA}^"
          fi
          base_commit="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          git merge-base --is-ancestor "${base_commit}" "${GITHUB_SHA}"
          [[ "${base_commit}" != "${GITHUB_SHA}" ]]
          echo "base=${base_commit}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned inventory enumerator
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-nextest@0.9.138
      - name: Build immutable-envelope verifier
        run: |
          cargo fetch --locked
          cargo build --locked -p openwepp-gate-planner --bin openwepp-gate-plan
      - name: Validate receipt and predicate bindings
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-recovery-package/unsigned
          EXPECTED_IMAGE: sha256:8a551a87d0784a74be1a76452beb1e4e6726cc36135722020e20a042e04bae84
          EXPECTED_BASE: ${{ steps.verification-comparison.outputs.base }}
        run: |
          set -euo pipefail
          receipt_sha="$(sha256sum "${EVIDENCE_DIR}/receipt.json" | cut -d' ' -f1)"
          jq -e \
            --arg receipt_sha "${receipt_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg base "${EXPECTED_BASE}" \
            --arg head "${GITHUB_SHA}" \
            --arg image "${EXPECTED_IMAGE}" \
            '.schema_version == "openwepp-testgate-attestation-v1"
             and .receipt_sha256 == $receipt_sha
             and .receipt_result == "PASS"
             and .receipt_trust_class == "LOCAL_UNTRUSTED"
             and .repository == $repository
             and .source_ref == $source_ref
             and .base_commit == $base
             and .head_commit == $head
             and .workflow == "testgate"
             and .job == "openwepp/execute-increment"
             and .runner_image == $image
             and (.receipt_plan_id | type == "string" and length == 64)
             and (.receipt_execution_key | type == "string" and length == 64)' \
            "${EVIDENCE_DIR}/attestation-predicate.json"
          jq -se \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg head "${GITHUB_SHA}" \
            '.[0] as $receipt | .[1] as $predicate |
             $receipt.result == "PASS"
             and $receipt.claims.trust_class == "LOCAL_UNTRUSTED"
             and $receipt.claims.repository == $repository
             and $receipt.claims.source_event == $source_event
             and $receipt.claims.source_ref == $source_ref
             and $receipt.claims.workflow == "testgate"
             and $receipt.claims.job == "openwepp/execute-increment"
             and $receipt.claims.runner == $predicate.runner
             and $receipt.environment.runner_image_sha256 == ($predicate.runner_image | sub("^sha256:"; ""))
             and $receipt.source.base_commit == $predicate.base_commit
             and $receipt.source.head_commit == $head
             and $receipt.source.dirty_tree_digest == null
             and $receipt.plan_id == $predicate.receipt_plan_id
             and $receipt.execution_key == $predicate.receipt_execution_key
             and $receipt.result == $predicate.receipt_result' \
            "${EVIDENCE_DIR}/receipt.json" \
            "${EVIDENCE_DIR}/attestation-predicate.json"
          python3 - "${EXPECTED_BASE}" "${GITHUB_SHA}" "${EVIDENCE_DIR}" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          from tools.local_ci.testgate import _intent_authorization

          base, head, evidence_text = sys.argv[1:]
          evidence = Path(evidence_text)
          predicate = json.loads((evidence / "attestation-predicate.json").read_text())
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACDMRT", base, head],
              text=True,
          ).splitlines()
          package_path = predicate["intent_authorization"]["package_path"]
          observed = _intent_authorization(Path.cwd(), base, changed, package_path)
          if observed != predicate["intent_authorization"]:
              raise SystemExit("intent authorization differs from base package and event diff")
          PY
          target/debug/openwepp-gate-plan verify-receipt-envelope \
            --repo . \
            --plan "${EVIDENCE_DIR}/terminal-plan.json" \
            --receipt "${EVIDENCE_DIR}/receipt.json" \
            --artifact-root "${EVIDENCE_DIR}/execution" \
            > "${EVIDENCE_DIR}/envelope-verification.json"
          jq -e '.result == "PASS" and .trust_class == "LOCAL_UNTRUSTED"' \
            "${EVIDENCE_DIR}/envelope-verification.json"
      - name: Upload independently verified evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testgate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-recovery-package/unsigned
          if-no-files-found: error
          retention-days: 7

  increment-gates:
    name: openwepp/increment-gates
    needs: [execute-increment, verify-increment]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Fail closed when required jobs did not succeed
        env:
          EXECUTION_RESULT: ${{ needs.execute-increment.result }}
          VERIFICATION_RESULT: ${{ needs.verify-increment.result }}
        run: |
          test "${EXECUTION_RESULT}" = success
          test "${VERIFICATION_RESULT}" = success
      - name: Download independently verified evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testgate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-evidence
      - name: Recheck immutable signing subject
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-evidence
        run: |
          set -euo pipefail
          receipt_sha="$(sha256sum "${EVIDENCE_DIR}/receipt.json" | cut -d' ' -f1)"
          jq -e \
            --arg receipt_sha "${receipt_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg head "${GITHUB_SHA}" \
            '.receipt_sha256 == $receipt_sha
             and .receipt_result == "PASS"
             and .receipt_trust_class == "LOCAL_UNTRUSTED"
             and .repository == $repository
             and .source_ref == $source_ref
             and .head_commit == $head
             and .workflow == "testgate"
             and .job == "openwepp/execute-increment"' \
            "${EVIDENCE_DIR}/attestation-predicate.json"
          jq -e '.result == "PASS" and .trust_class == "LOCAL_UNTRUSTED"' \
            "${EVIDENCE_DIR}/envelope-verification.json"
      - name: Reject superseded head before authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${GITHUB_SHA}" != "${current_head}" ]]; then
            echo "ERROR: refusing authority for superseded head ${GITHUB_SHA}; current main is ${current_head}" >&2
            exit 1
          fi
      - name: Authenticate receipt to repository and workflow identity
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/testgate-evidence/receipt.json
          predicate-type: https://openwepp.org/attestations/testgate/v1
          predicate-path: ${{ runner.temp }}/testgate-evidence/attestation-predicate.json
      - name: Verify native attestation before authority succeeds
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/testgate-evidence
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -- "${BUNDLE_PATH}" "${EVIDENCE_DIR}/github-attestation.jsonl"
          gh attestation verify "${EVIDENCE_DIR}/receipt.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/testgate-shadow.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type https://openwepp.org/attestations/testgate/v1 \
            --deny-self-hosted-runners \
            --bundle "${EVIDENCE_DIR}/github-attestation.jsonl" \
            --format json > "${EVIDENCE_DIR}/attestation-verification.json"
          jq -e 'length == 1' "${EVIDENCE_DIR}/attestation-verification.json"
      - name: Upload authenticated gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testgate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testgate-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Reject superseded head after authority verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${GITHUB_SHA}" != "${current_head}" ]]; then
            echo "ERROR: refusing aggregate success for superseded head ${GITHUB_SHA}; current main is ${current_head}" >&2
            exit 1
          fi
