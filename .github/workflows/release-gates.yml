name: release-gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      assemble_release:
        description: "Explicitly assemble a release candidate after validation"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag (blank derives yymmdd + GitHub run number)"
        required: false
        default: ""
        type: string
      run_stability:
        description: "Run stability cohort gate (requires self-hosted data roots)"
        required: true
        default: false
        type: boolean
      cohort_seeds_csv:
        description: "Path to defect_seeds.csv"
        required: true
        default: "/workdir/wepp-forest/docs/work-packages/20260503-wb05b-forest-hillslope-closure-sweep/artifacts/audits/_meta/defect_seeds.csv"
        type: string
      watchlist_csv:
        description: "Path to hillslope_watchlist.csv"
        required: true
        default: "/workdir/wepp-forest/docs/ablation/hillslope_watchlist.csv"
        type: string
      wepp_forest_root:
        description: "Root path for wepp-forest relative watchlist entries"
        required: true
        default: "/workdir/wepp-forest"
        type: string
      wc1_root:
        description: "Root path for wc1 run trees"
        required: true
        default: "/wc1/runs"
        type: string
      hillstab_jobs:
        description: "Parallel workers for stability harness"
        required: true
        default: "4"
        type: string
      hillstab_timeout_seconds:
        description: "Per-case timeout in seconds"
        required: true
        default: "180"
        type: string
      expect_1166:
        description: "Expected wb05b_1166 total"
        required: true
        default: "1166"
        type: string
      expect_watchlist:
        description: "Expected release_gate_watchlist total"
        required: true
        default: "19"
        type: string
      run_authority_periodic:
        description: "Run periodic authority-suite lane"
        required: true
        default: false
        type: boolean
      run_authority_manual:
        description: "Run manual authority-suite lane"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  workspace-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install gate tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-nextest --locked --version 0.9.138
          cargo install cargo-llvm-cov --locked --version 0.8.7
          cargo install cargo-crap --locked --version 0.2.2
          python -m venv .venv

      - name: Run workspace validation gates
        id: validation_gates
        run: |
          validation_dir="${RUNNER_TEMP}/openwepp_validation_${GITHUB_RUN_ID}"
          mkdir -p "${validation_dir}"
          echo "validation_dir=${validation_dir}" >> "${GITHUB_OUTPUT}"
          gate_cmd=(
            bash tools/release/run_release_candidate_gates.sh
            --mode validate
            --release-dir "${validation_dir}"
            --skip-stability
          )
          crap_base_ref=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            crap_base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            if [[ ! "${before_sha}" =~ ^0+$ ]]; then
              crap_base_ref="${before_sha}"
            fi
          fi
          if [[ -n "${crap_base_ref}" ]]; then
            gate_cmd+=(--crap-base-ref "${crap_base_ref}")
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            gate_cmd+=(--run-authority-periodic)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_authority_periodic }}" == "true" ]]; then
            gate_cmd+=(--run-authority-periodic)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_authority_manual }}" == "true" ]]; then
            gate_cmd+=(--run-authority-manual)
          fi
          set +e
          "${gate_cmd[@]}" 2>&1 | tee "${validation_dir}/validation-gates.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "${gate_status}" > "${validation_dir}/validation-gates-exit-status.txt"
          exit "${gate_status}"

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openwepp-validation-evidence-${{ github.run_id }}
          path: ${{ steps.validation_gates.outputs.validation_dir }}
          if-no-files-found: error

  release-assembly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_release && inputs.run_stability && needs.workspace-validation.result == 'success' && needs.stability-cohort.result == 'success' }}
    needs:
      - workspace-validation
      - stability-cohort
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install release gate tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-nextest --locked --version 0.9.138
          cargo install cargo-llvm-cov --locked --version 0.8.7
          cargo install cargo-crap --locked --version 0.2.2
          python -m venv .venv

      - name: Release assurance transition preflight
        id: release_preflight
        run: |
          evidence_dir="${RUNNER_TEMP}/openwepp_release_transition_${GITHUB_RUN_ID}"
          mkdir -p "${evidence_dir}"
          echo "evidence_dir=${evidence_dir}" >> "${GITHUB_OUTPUT}"
          bash tools/release/check_assurance_release_transition.sh \
            --mode release \
            2>&1 | tee "${evidence_dir}/assurance-transition-preflight.log"

      - name: Explicitly assemble release candidate
        id: release_assembly
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="$(date -u +%y%m%d)rc${GITHUB_RUN_NUMBER}"
          fi
          release_dir="${RUNNER_TEMP}/openwepp_release_${release_tag}"
          mkdir -p "${release_dir}"
          echo "release_dir=${release_dir}" >> "${GITHUB_OUTPUT}"
          bash tools/release/run_release_candidate_gates.sh \
            --mode release \
            --release-tag "${release_tag}" \
            --release-dir "${release_dir}" \
            --skip-stability \
            2>&1 | tee "${release_dir}/release-gates.log"

      - name: Upload explicit release candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: openwepp-release-candidate-${{ github.run_id }}
          path: ${{ steps.release_assembly.outputs.release_dir }}
          if-no-files-found: error

      - name: Upload failed release evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: openwepp-release-failure-evidence-${{ github.run_id }}
          path: |
            ${{ steps.release_preflight.outputs.evidence_dir }}
            ${{ steps.release_assembly.outputs.release_dir }}
          if-no-files-found: warn

  stability-cohort:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stability }}
    needs: workspace-validation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build hillslope release binary
        run: cargo build --release -p openwepp-runner --bin openwepp-cli-hill

      - name: Run stability cohort gate
        id: hillstab_gate
        run: |
          results_json="${RUNNER_TEMP}/hillstab_results.json"
          bash tools/release/run_hillstab_gate.sh \
            --openwepp-binary "${GITHUB_WORKSPACE}/target/release/openwepp-cli-hill" \
            --cohort-seeds-csv "${{ inputs.cohort_seeds_csv }}" \
            --watchlist-csv "${{ inputs.watchlist_csv }}" \
            --wepp-forest-root "${{ inputs.wepp_forest_root }}" \
            --wc1-root "${{ inputs.wc1_root }}" \
            --output-json "${results_json}" \
            --jobs "${{ inputs.hillstab_jobs }}" \
            --timeout-seconds "${{ inputs.hillstab_timeout_seconds }}" \
            --expect-suite "wb05b_1166=${{ inputs.expect_1166 }}" \
            --expect-suite "release_gate_watchlist=${{ inputs.expect_watchlist }}"
          echo "results_json=${results_json}" >> "${GITHUB_OUTPUT}"

      - name: Upload stability results
        uses: actions/upload-artifact@v4
        with:
          name: openwepp-hillstab-results-${{ github.run_id }}
          path: ${{ steps.hillstab_gate.outputs.results_json }}
          if-no-files-found: error
