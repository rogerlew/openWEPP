[package]
name = "openwepp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = ["crates/openwepp-input-contract"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
openwepp-input-contract = { path = "crates/openwepp-input-contract", version = "0.1.0" }

[[test]]
name = "infile_slope_parser_contract"
path = "tests/integration/infile_slope_parser_contract.rs"

[[test]]
name = "infile_soil_parser_contract"
path = "tests/integration/infile_soil_parser_contract.rs"

[[test]]
name = "infile_climate_parser_contract"
path = "tests/integration/infile_climate_parser_contract.rs"

[[test]]
name = "infile_management_parser_contract"
path = "tests/integration/infile_management_parser_contract.rs"

[[test]]
name = "infile_frost_parser_contract"
path = "tests/integration/infile_frost_parser_contract.rs"

[[test]]
name = "infile_irrigation_depletion_parser_contract"
path = "tests/integration/infile_irrigation_depletion_parser_contract.rs"

[[test]]
name = "infile_irrigation_fixeddate_parser_contract"
path = "tests/integration/infile_irrigation_fixeddate_parser_contract.rs"

[[test]]
name = "infile_pmetpara_parser_contract"
path = "tests/integration/infile_pmetpara_parser_contract.rs"

[[test]]
name = "infile_snow_parser_contract"
path = "tests/integration/infile_snow_parser_contract.rs"

[[test]]
name = "infile_weppui_parser_contract"
path = "tests/integration/infile_weppui_parser_contract.rs"

[[test]]
name = "infile_watershed_channel_parser_contract"
path = "tests/integration/infile_watershed_channel_parser_contract.rs"

[[test]]
name = "infile_watershed_impoundment_parser_contract"
path = "tests/integration/infile_watershed_impoundment_parser_contract.rs"

[[test]]
name = "infile_watershed_structure_parser_contract"
path = "tests/integration/infile_watershed_structure_parser_contract.rs"

[profile.release]
lto = "thin"
codegen-units = 1
