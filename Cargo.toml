[package]
name = "openwepp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = [
    "crates/openwepp-climate-runtime-adapter",
    "crates/openwepp-hillslope-output",
    "crates/openwepp-watershed-output",
    "crates/openwepp-input-contract",
    "crates/openwepp-sim-contract",
    "crates/openwepp-kernel-contract",
    "crates/openwepp-topology",
    "crates/openwepp-hillslope-orchestrator",
    "crates/openwepp-watershed-orchestrator",
    "crates/openwepp-legacy-bridge",
    "crates/openwepp-meteorology",
    "crates/openwepp-unit-boundary",
    "crates/openwepp-summary-accumulator",
    "crates/openwepp-comparator-metadata",
    "crates/openwepp-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Complexity ratchet target (ADR-0021; code-quality-refactor-authoring-guide.md §8).
# `cognitive_complexity` is a nursery lint (off by default). It is held at `allow`
# workspace-wide because the current high-complexity backlog would fail the
# `-D warnings` gate. Code-quality refactor packages opt a module in via a
# module-level `#![warn(clippy::cognitive_complexity)]` as it reaches closure, and
# this is promoted to `warn` workspace-wide once the backlog clears. Threshold is
# in clippy.toml; cargo-crap is the active repo-wide complexity ratchet.
# (`too_many_lines` is already on via `pedantic`; its baseline is the existing
# `#[allow(clippy::too_many_lines)]` attributes, burned down as functions shrink.)
cognitive_complexity = "allow"

[lints]
workspace = true

[dependencies]
openwepp-climate-runtime-adapter = { path = "crates/openwepp-climate-runtime-adapter", version = "0.1.0" }
openwepp-input-contract = { path = "crates/openwepp-input-contract", version = "0.1.0" }
openwepp-sim-contract = { path = "crates/openwepp-sim-contract", version = "0.1.0" }
openwepp-kernel-contract = { path = "crates/openwepp-kernel-contract", version = "0.1.0" }
openwepp-topology = { path = "crates/openwepp-topology", version = "0.1.0" }
openwepp-hillslope-orchestrator = { path = "crates/openwepp-hillslope-orchestrator", version = "0.1.0" }
openwepp-watershed-output = { path = "crates/openwepp-watershed-output", version = "0.1.0" }
openwepp-watershed-orchestrator = { path = "crates/openwepp-watershed-orchestrator", version = "0.1.0" }
openwepp-legacy-bridge = { path = "crates/openwepp-legacy-bridge", version = "0.1.0" }
openwepp-unit-boundary = { path = "crates/openwepp-unit-boundary", version = "0.1.0" }
openwepp-summary-accumulator = { path = "crates/openwepp-summary-accumulator", version = "0.1.0" }
openwepp-comparator-metadata = { path = "crates/openwepp-comparator-metadata", version = "0.1.0" }
openwepp-runner = { path = "crates/openwepp-runner", version = "0.1.0" }

[dev-dependencies]
flate2 = "1.1.0"
arrow-schema = "54.2.1"
parquet = "54.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openwepp-hillslope-output = { path = "crates/openwepp-hillslope-output", version = "0.1.0" }

