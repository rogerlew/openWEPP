[package]
name = "openwepp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = [
    "crates/openwepp-climate-runtime-adapter",
    "crates/openwepp-input-contract",
    "crates/openwepp-sim-contract",
    "crates/openwepp-kernel-contract",
    "crates/openwepp-topology",
    "crates/openwepp-hillslope-orchestrator",
    "crates/openwepp-watershed-orchestrator",
    "crates/openwepp-legacy-bridge",
    "crates/openwepp-unit-boundary",
    "crates/openwepp-summary-accumulator",
    "crates/openwepp-comparator-metadata",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.85"
repository = "https://github.com/rogerlew/openWEPP"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
openwepp-climate-runtime-adapter = { path = "crates/openwepp-climate-runtime-adapter", version = "0.1.0" }
openwepp-input-contract = { path = "crates/openwepp-input-contract", version = "0.1.0" }
openwepp-sim-contract = { path = "crates/openwepp-sim-contract", version = "0.1.0" }
openwepp-kernel-contract = { path = "crates/openwepp-kernel-contract", version = "0.1.0" }
openwepp-topology = { path = "crates/openwepp-topology", version = "0.1.0" }
openwepp-hillslope-orchestrator = { path = "crates/openwepp-hillslope-orchestrator", version = "0.1.0" }
openwepp-watershed-orchestrator = { path = "crates/openwepp-watershed-orchestrator", version = "0.1.0" }
openwepp-legacy-bridge = { path = "crates/openwepp-legacy-bridge", version = "0.1.0" }
openwepp-unit-boundary = { path = "crates/openwepp-unit-boundary", version = "0.1.0" }
openwepp-summary-accumulator = { path = "crates/openwepp-summary-accumulator", version = "0.1.0" }
openwepp-comparator-metadata = { path = "crates/openwepp-comparator-metadata", version = "0.1.0" }

[dev-dependencies]
flate2 = "1.1.0"

