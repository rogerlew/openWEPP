# openWEPP nextest scheduling policy.
#
# Goals:
# - keep ordinary contract/unit tests highly parallel;
# - keep subprocess-heavy CLI, snowbench, SNOTEL, PySnobal, and frost fixtures
#   from saturating CPU and parquet I/O at the same time;
# - provide explicit quick/full/domain profiles for local and CI gate selection.

[store]
dir = "target/nextest"

[profile.default]
default-filter = "all()"
fail-fast = true
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "slow"
final-status-level = "flaky"
failure-output = "immediate-final"
success-output = "never"

[profile.default.junit]
path = "junit.xml"
report-name = "openwepp-nextest-default"
store-success-output = false
store-failure-output = true

# Fast implementation loop: excludes the known long-running fixture families.
# Use `cargo nextest run --workspace --profile quick`.
[profile.quick]
inherits = "default"
default-filter = '''
all() - (
    binary(/^(cli01_runner_hillslope_integration|cli03_runner_contract_derived_tests|cli04_runner_wat_parquet_contract_derived_tests)$/)
    | binary(/^(r6_direct_publication_cutover_cli_contract|simimpl04_.*)$/)
    | binary(/^(snowdensity03_physics_bulk_offline_contract|snowdensity05e_melt_adjudication|snowdensity05g_harness_fidelity_rerun)$/)
    | binary(/^(snowdensity06_density_compaction|snowdensity06b_coe_bound_density_replay|snowdensity10_3_1a_per_day_cancov)$/)
    | binary(/^(snowfrost_fidelity_g0_pysnobal_bridge_contract)$/)
    | test(/(snowbench|pysnobal|snotel|coe_melt_snowbench|physics_bulk_snowbench|density_compaction_snowbench)/)
    | test(/(r6j_|r7c_direct_production|r7d_direct|r7e_default_candidate|simimpl14_contract_gate)/)
)
'''
fail-fast = true

[profile.quick.junit]
path = "junit.xml"
report-name = "openwepp-nextest-quick"
store-success-output = false
store-failure-output = true

# Planner-selected affected-package execution. The plan supplies the exact
# package/test selector; this profile owns only scheduling and receipt identity.
[profile.affected]
inherits = "default"
default-filter = "all()"
fail-fast = true

[profile.affected.junit]
path = "junit.xml"
report-name = "openwepp-nextest-affected"
store-success-output = false
store-failure-output = true

# Explicit development fixture for changes to TESTGATE inventory enumeration,
# repository reconstruction, gate definitions, or audit bindings. It is
# intentionally ignored by routine profiles; run it with:
# cargo nextest run -p openwepp-gate-planner --profile testgate-development --run-ignored ignored-only
[profile.testgate-development]
inherits = "default"
default-filter = '''
package(openwepp-gate-planner)
& test(/(pre_heavy::coverage_tests::exact_planner_output_reconstructs_through_the_public_audit_path|planner::tests::terminal_reconciliation_reports_added_paths_and_escalation|verifier::tests::(verifier_accepts_truthful_fail_and_blocked_receipts|normalized_junit_artifacts_reconstruct_exact_inventory|receipt_verification_reconstructs_identity_dag_inventory_and_artifacts|envelope_requires_exact_subject_bundle_current_issuer_and_external_proof)|verifier::tests::coverage_tests::ready_audit_verification_preserves_order_and_exact_verdict|executor::tests::terminal_plan_(executes_and_independent_verifier_accepts_pass_receipt|preserves_fail_and_blocked_attempts_in_verified_receipt|detects_out_of_manifest_source_mutation_and_verifies_invalid_receipt)|executor::coverage_tests::(public_stage_selection_preserves_light_final_and_rejection_shapes|ready_audited_heavy_preserves_import_and_final_receipt_bindings))/)
'''
fail-fast = true
slow-timeout = { period = "90s", terminate-after = 8 }

[profile.testgate-development.junit]
path = "junit.xml"
report-name = "openwepp-nextest-testgate-development"
store-success-output = false
store-failure-output = true

# Scientific-assurance editorial loop. This retains the complete assurance
# crate plus the source, planner, assembly, normalization, and report-facing
# integration boundaries while excluding unrelated kernel and publication suites.
# Use `cargo nextest run --workspace --profile assurance-editorial` only for an
# exact converter-produced DRAFT prose normalization.
[profile.assurance-editorial]
inherits = "default"
default-filter = '''
package(openwepp-assurance)
| binary(/^assurance_v2_(source|planner|assembly|normalization)_contract$/)
| binary(/^assurance_v2_.*_report_contract$/)
'''
fail-fast = false

[profile.assurance-editorial.junit]
path = "junit.xml"
report-name = "openwepp-nextest-assurance-editorial"
store-success-output = false
store-failure-output = true

# Receipt-authorized assurance data amendment. Keep this manifest narrow and
# explicit: it is the complete proportional proof for typed report-data-only
# transactions, never an implementation, publication, or release gate.
[profile.assurance-amendment]
inherits = "default"
default-filter = '''
(package(openwepp-assurance) & test(/^(cli::tests::amendment_data_commands_parse_complete_requests_before_backend_entry|cli::tests::amendment_recovery_command_reaches_typed_backend|cli::tests::exactly_one_selection_is_admitted|cli::tests::inspect_and_lifecycle_commands_cover_human_json_and_request_paths|cli::tests::normalization_requires_one_explicit_mode|cli::tests::publication_options_bind_all_explicit_cli_inputs|v2::assembly::tests::post_install_source_drift_restores_prior_bytes_without_timing|v2::confined::tests::ambient_identity_detects_path_replacement|v2::confined::tests::ambient_open_creates_missing_components_and_rejects_unconfined_paths|v2::confined::tests::held_relationship_walks_descriptor_subtrees|v2::confined::tests::opened_directory_descriptor_survives_path_replacement|v2::confined::tests::opened_file_descriptor_survives_final_path_replacement|v2::lifecycle::tests::finding_disposition_contract_covers_every_state|v2::planner::tests::blocked_prerequisite_takes_precedence_over_intrinsic_staleness|v2::planner::tests::graph_propagates_stale_and_blocked_with_stable_order|v2::planner::tests::graph_rejects_missing_edge_cycle_and_unused_node|v2::publication::tests::canonical_link_recognizer_rejects_nonrendered_examples|v2::publication::tests::every_approval_leaf_changes_the_approval_layer|v2::publication::tests::every_finding_leaf_changes_the_finding_layer|v2::publication::tests::every_transfer_leaf_changes_the_transfer_layer|v2::publication::tests::transition_classification_exactly_covers_current_nonidentity_leaves|v2::publication::tests::unclassified_future_transition_subtree_leaves_default_to_subject_bound|v2::transaction::tests::committed_cleanup_fault_leaves_new_generation_and_typed_recovery_state|v2::transaction::tests::every_precommit_fault_preserves_the_active_generation|v2::transaction::tests::recovery_tree_verifier_checks_the_selected_generation_members)$/))
| binary(assurance_v2_amendment_contract)
| (binary(assurance_v2_source_contract) & test(/(real_sources_satisfy|protected_public_surface)/))
| (binary(assurance_v2_planner_contract) & test(/(current_one_and_all_plans|malformed_authority)/))
| (binary(assurance_v2_assembly_contract) & test(real_named_and_all_builds))
| (binary(assurance_v2_normalization_contract) & test(/(current_report_is_american|apply_rebinds_complete|lifecycle_review_and_packet)/))
| (binary(assurance_v2_publication_contract) & test(stale_roots_open_findings))
'''
fail-fast = false

[profile.assurance-amendment.junit]
path = "junit.xml"
report-name = "openwepp-nextest-assurance-amendment"
store-success-output = false
store-failure-output = true

# Handoff gate: full workspace, but with slow fixture families scheduled through
# the groups below instead of unconstrained parallel execution.
# Use `cargo nextest run --workspace --profile full`.
[profile.full]
inherits = "default"
default-filter = "all()"
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 8 }

[profile.full.junit]
path = "junit.xml"
report-name = "openwepp-nextest-full"
store-success-output = false
store-failure-output = true

# Lifecycle aliases retain complete inventory while giving checkpoint,
# campaign, and release receipts distinct configuration identities.
[profile.checkpoint]
inherits = "full"

[profile.checkpoint.junit]
path = "junit.xml"
report-name = "openwepp-nextest-checkpoint"
store-success-output = false
store-failure-output = true

[profile.campaign]
inherits = "full"

[profile.campaign.junit]
path = "junit.xml"
report-name = "openwepp-nextest-campaign"
store-success-output = false
store-failure-output = true

[profile.release]
inherits = "full"

[profile.release.junit]
path = "junit.xml"
report-name = "openwepp-nextest-release"
store-success-output = false
store-failure-output = true

# Snow/frost-focused gate for the fidelity arc. This intentionally includes
# snow-density, frost, Paradigm 2, PySnobal, and snow carry lineage tests.
# Use `cargo nextest run --workspace --profile frost`.
[profile.frost]
inherits = "default"
default-filter = '''
binary(/^(snowdensity.*|snowfrost.*|paradigm2.*|cancov_stratified_observations)$/)
| binary(/^(hphys03(09|10|11|12|13|15|16|17|18|19|20).*)$/)
| test(/(snow|frost|swe|snotel|pysnobal|snowbench|melt|winter|stmtim)/)
'''
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 8 }

[profile.frost.junit]
path = "junit.xml"
report-name = "openwepp-nextest-frost"
store-success-output = false
store-failure-output = true

# Erosion/sediment/routing-focused gate. This is the default local confidence
# profile for SC-SED, HBP sediment, runoff partition, and routing handoff work.
# Use `cargo nextest run --workspace --profile erosion`.
[profile.erosion]
inherits = "default"
default-filter = '''
binary(/(erosion|erod|sediment|hbp|route|routing|runoffpart)/)
| test(/(erosion|erod|sediment|wave1|sedcon|tdet|tdep|hbp|route|routing|runoffpart|p61|p102|dff_ws3)/)
'''
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 8 }

[profile.erosion.junit]
path = "junit.xml"
report-name = "openwepp-nextest-erosion"
store-success-output = false
store-failure-output = true

[test-groups.snowbench]
max-threads = 1

[test-groups.cli-fixture]
max-threads = 4

[test-groups.frost-fixture]
max-threads = 4

[test-groups.runner-fixture]
max-threads = 4

[test-groups.assurance-publication]
max-threads = 4

[test-groups.repository-snapshot]
max-threads = 1

# The snowbench/PySnobal tests are the observed top wall-time offenders. Keep
# them serial to avoid multiple full WAT/PySnobal export pipelines competing for
# parquet and target-dir I/O.
[[profile.default.overrides]]
filter = '''
binary(/^(snowdensity03_physics_bulk_offline_contract|snowdensity05e_melt_adjudication|snowdensity05g_harness_fidelity_rerun)$/)
| binary(/^(snowdensity06_density_compaction|snowdensity06b_coe_bound_density_replay|snowdensity10_3_1a_per_day_cancov)$/)
| binary(/^(snowfrost_fidelity_g0_pysnobal_bridge_contract)$/)
| test(/(snowbench|pysnobal|snotel|coe_melt_snowbench|physics_bulk_snowbench|density_compaction_snowbench)/)
'''
test-group = "snowbench"
threads-required = 4
slow-timeout = { period = "90s", terminate-after = 8 }

# CLI integration fixtures spawn openwepp binaries and write parquet/manifest
# output. `forest` local-CI sweep on 2026-07-05 selected group cap 4
# (`245.884s -> 120.590s` versus cap 2). With `threads-required = 2`, this
# permits two matching fixture tests at once while still avoiding full CPU fanout.
[[profile.default.overrides]]
filter = '''
binary(/^(cli01_runner_hillslope_integration|cli03_runner_contract_derived_tests|cli04_runner_wat_parquet_contract_derived_tests)$/)
| binary(/^(r6_direct_publication_cutover_cli_contract|simimpl04_.*|watershed_cli_behavior_contract)$/)
'''
test-group = "cli-fixture"
threads-required = 2
slow-timeout = { period = "90s", terminate-after = 6 }

# Snow/frost observation and mechanism diagnostics can be expensive even when
# they are not snowbench exports. The snowbench override above remains serial.
# `forest` local-CI sweep selected group cap 4 for the non-snowbench frost
# subset; with `threads-required = 2`, this permits two matching tests at once.
[[profile.default.overrides]]
filter = '''
binary(/^(snowdensity.*|snowfrost.*|paradigm2.*|cancov_stratified_observations)$/)
| test(/(snow|frost|swe|melt|winter|stmtim)/)
'''
test-group = "frost-fixture"
threads-required = 2
slow-timeout = { period = "90s", terminate-after = 6 }

# Runner library fixture tests are individual libtest cases under the
# openwepp_runner binary. Nextest can split them, so cap them by test name rather
# than serializing the whole runner unit-test suite. `forest` local-CI sweep on
# 2026-07-05 selected group cap 4 (`71.948s -> 31.159s` versus cap 2). With
# `threads-required = 2`, this permits two matching fixture tests at once.
[[profile.default.overrides]]
filter = '''
package(openwepp-runner)
& test(/(r6j_|r7c_direct_production|r7d_direct|r7e_default_candidate|simimpl14_contract_gate)/)
'''
test-group = "runner-fixture"
threads-required = 2
slow-timeout = { period = "90s", terminate-after = 6 }

# The assurance publication contract cases repeatedly build, hash, and verify
# complete report trees. Fresh LLVM coverage on the 48-logical/24-physical-core
# local runner allowed all 25 cases to compete: 2,167/2,169 tests passed, but
# two publication cases reached the unchanged 720-second ceiling. Repeated
# terminal execution then reproduced the timeout with four-way concurrency.
# Two-way publication concurrency preserves host parallelism while bounding
# this complete binary as one resource cohort; each case reserves two scheduler
# slots. Selection and timeout are unchanged.
[[profile.default.overrides]]
filter = 'binary(assurance_v2_publication_contract)'
test-group = "assurance-publication"
threads-required = 2

# Planner executor/verifier fixtures archive the repository and may compile an
# independent target tree. Keep those content-independence checks intact while
# preventing complete snapshot/linker builds from competing with any other
# test on bounded runner memory and executable temporary storage.
[[profile.default.overrides]]
filter = '''
package(openwepp-gate-planner)
& test(/(pre_heavy::coverage_tests::exact_planner_output_reconstructs_through_the_public_audit_path|planner::tests::terminal_reconciliation_reports_added_paths_and_escalation|verifier::tests::(verifier_accepts_truthful_fail_and_blocked_receipts|normalized_junit_artifacts_reconstruct_exact_inventory|receipt_verification_reconstructs_identity_dag_inventory_and_artifacts|envelope_requires_exact_subject_bundle_current_issuer_and_external_proof)|verifier::tests::coverage_tests::ready_audit_verification_preserves_order_and_exact_verdict|executor::tests::terminal_plan_(executes_and_independent_verifier_accepts_pass_receipt|preserves_fail_and_blocked_attempts_in_verified_receipt|detects_out_of_manifest_source_mutation_and_verifies_invalid_receipt)|executor::coverage_tests::(public_stage_selection_preserves_light_final_and_rejection_shapes|ready_audited_heavy_preserves_import_and_final_receipt_bindings))/)
'''
test-group = "repository-snapshot"
threads-required = "num-test-threads"
slow-timeout = { period = "90s", terminate-after = 8 }
