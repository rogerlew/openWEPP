empirical: insufficient_evidence
summary: >-
  The retained comparison is useful diagnostic evidence and supported selection
  of a production snow-phase default under its retrospective rubric. It does
  not yet provide a portable, prospectively specified, independently reviewed
  basis for a favorable empirical claim. The baseline characterization is
  therefore INSUFFICIENT_EVIDENCE. Three narrow historical implementation and
  conservation obligations pass, while the aggregate current-release
  verification profile remains BLOCKED by unassembled lineage and unrun work.
applies_to:
  - Auditing the evidence that informed the current snow-phase default.
  - Identifying observed regimes and response signatures for a future prospective campaign.
  - Understanding which absolute quantities are forcing-limited in the retained comparison.
unknowns:
  - Performance for climates, elevations, forest canopies, disturbances, and extremes outside the five station fixtures.
  - Accuracy under the forcing and parameter sources used by a particular application.
  - Whether retrospective rubric results reproduce from raw acquisition in a portable locked environment.
  - Application-specific adequacy for runoff, erosion, operations, design, or regulatory decisions.
application_boundary: >-
  A user must compare their climate, forcing, topography, canopy, scale,
  quantity, required accuracy, and consequence of error with this tested
  domain. This dossier neither authorizes nor rejects an application.
