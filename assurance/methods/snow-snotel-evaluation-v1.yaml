schema_version: 1
method_id: snow-snotel-evaluation-v1
version: 1.0.0
title: SNOTEL Snow Evaluation Method
owner: openWEPP snow-process evaluation steward
design: retrospective
question: >-
  What does the retained five-climate SNOTEL comparison reveal about simulated
  snow water equivalent, station-derived depth, derived bulk density, and
  forcing-robust seasonal response signatures?
quantities:
  - Snow water equivalent in meters of water equivalent at daily scale.
  - Station-derived snow depth in meters at daily scale.
  - Bulk snow density in kilograms per cubic meter, derived where SWE and depth pair.
  - Seasonal timing and depth-SWE response signatures treated as more forcing-robust than absolute magnitude.
domain:
  - "Five SNOTEL climates: Mica Creek/St. Joe, Paradise, CSS Lab, Snowbird, and Niwot."
  - Site records begin between water years 2002 and 2006 and extend through 2024.
  - The retained manifest records 70,999 daily rows and 13,590 paired SWE-depth rows across the five sites.
  - Open, point-station snow conditions represented by the retained hillslope fixtures.
datasets:
  - NRCS SNOTEL daily observations normalized into five tracked site CSV files; no calibration/evaluation split was used.
  - DAYMET, GRIDMET, CLIGEN, or PRISM forcing according to the retained fixture for each site.
  - Historical openWEPP model variants compared retrospectively; legacy WEPP and PySnobal were diagnostic flags, not targets.
metrics:
  - Robust ordinal cells for seasonal timing, density seasonality, and depth-SWE response.
  - Report-only absolute SWE, depth, and density bias and fit metrics because forcing uncertainty limits attribution.
  - Phase-partition conservation residual and selected-model trace for the activated default.
criteria:
  - Historical rubric thresholds were chosen retrospectively and cannot establish a prospectively tested favorable claim.
  - A model variant could inform activation only when robust fail count did not increase, robust ordinal score did not decrease, and declared blockers remained absent.
  - Current dossier publication requires complete portable provenance and independent scientific review before any favorable empirical characterization.
uncertainty:
  - Precipitation and meteorological forcing uncertainty may dominate absolute SWE and depth error.
  - SNOTEL depth is station-derived and can contain step changes or sensor artifacts; density compounds SWE and depth uncertainty.
  - Point observations and hillslope representations differ in spatial support.
  - Retrospective model and threshold selection increases selection-bias risk.
reproduction:
  - The source checkout retains normalized observations under tests/fixtures/snotel_observed/.
  - The diagnostic implementation is tools/snowfreeze_observed/cross_snotel_mechanism_rubric.py.
  - The activation implementation is tools/snowfreeze_observed/harder_pomeroy_default_activation.py.
  - Content-identified retained reports and integration guards are listed in the dossier evidence manifest.
  - Raw acquisition replay and a single portable environment lock are incomplete; see the dossier limitations.
