  unit_ids:
  - target_count
  reference_ids:
  - CANOPY-REF-JOLLY
methods:
- id: CANOPY-METHOD-VERIFICATION
  title: Contract and production-consumer verification
  owner: openWEPP plant-process owner
  description: Independent equations, closure ledgers, chronology checks, and real-consumer lineage.
  procedure: Apply the named contract invariants and reconstruct daily state and mass operands independently of producer summaries.
  dependency_ids:
  - CANOPY-DEP-SC-PLANT
  - CANOPY-DEP-SC-RESIDUE
  - CANOPY-DEP-SC-MANAGEMENT
  unit_ids: []
- id: CANOPY-METHOD-TIMING
  title: Frozen calibration and no-refit holdout scoring
  owner: CAL-04B method steward
  description: Retain the minimum-plus-one-day Hubbard ensemble and score Harvard once without membership changes.
  procedure: Count accepted rows and reconstruct Harvard score and interval-coverage summaries.
  dependency_ids:
  - CANOPY-DEP-ACCEPTED
  - CANOPY-DEP-CONFIGURATIONS
  - CANOPY-DEP-HARVARD
  unit_ids:
  - member_count
  - day
  - percent
  - degC
  - Pa
  - hour
- id: CANOPY-METHOD-LITTER
  title: Source-decay ridge reconstruction
  owner: CAL-05 method steward
  description: Compare five synthetic source-rate pairs against one finite-horizon stock.
  procedure: Reconstruct row count, common target, and maximum absolute difference.
  dependency_ids:
  - CANOPY-DEP-RIDGE
  unit_ids:
  - pair_count
  - kg_m2
- id: CANOPY-METHOD-GRADIENT
  title: Canopy-gradient ensemble characterization
  owner: CAL-06 method steward
  description: Cross all accepted members with available forest strata and retain open controls.
  procedure: Verify exact site-stratum inventory, member counts, run count, and winter ordering.
  dependency_ids:
  - CANOPY-DEP-GRADIENT
  unit_ids:
  - member_count
  - run_count
- id: CANOPY-METHOD-BEZA
  title: Product-consistent seasonal-transition audit
  owner: CAL-07F method steward
  description: Score same-direction GSI crossings against gcc_mean and gcc_90 transitions with frozen penalties.
  procedure: Count complete members, confidence-interval hits, and penalized errors for the best joint member.
  dependency_ids:
  - CANOPY-DEP-BEZA
  unit_ids:
  - member_count
  - transition_count
  - day
- id: CANOPY-METHOD-SOUTHERN-DIAGNOSTIC
  title: Southern Hemisphere relative-shape diagnostic
  owner: CAL-09 method steward
  description: Display CAL-07C relative observed and modeled seasonal shapes for Alerce and Bezà without promoting the combined direction verdict.
  procedure: Normalize retained relative series within site-year and plot model ensemble range, median, daily observation, and centered 15-day observation mean.
  dependency_ids:
  - CANOPY-DEP-F7-DATA
  - CANOPY-DEP-FIGURE-BUILDER
  - CANOPY-DEP-FIGURE-MANIFEST
  unit_ids: []
- id: CANOPY-METHOD-ELLIOT
  title: Retained Elliot target comparison
  owner: CAL-02 method steward
  description: Compare authorized reconstruction outputs with report targets under frozen tolerances.
  procedure: Count retained comparison rows and CONTRADICTED classifications.
  dependency_ids:
  - CANOPY-DEP-ELLIOT
  unit_ids:
  - target_count
- id: CANOPY-METHOD-FIGURES
  title: Deterministic time-series research-object generation
  owner: CAL-09 method steward
  description: Rebuild the eight reviewed time-series SVGs and retained derived plot tables from repository-relative source objects.
  procedure: Execute build_candidate_figures.py in the declared Python plotting environment and compare all retained SVG and CSV identities.
  dependency_ids:
  - CANOPY-DEP-FIGURE-BUILDER
  - CANOPY-DEP-FIGURE-MANIFEST
  - CANOPY-DEP-DAILY-CLIMATOLOGY
  - CANOPY-DEP-CONFIGURATIONS
  - CANOPY-DEP-ACCEPTED
  - CANOPY-DEP-RIDGE-DESIGN
  - CANOPY-DEP-SOUTHERN-DAILY
  - CANOPY-DEP-BEZA-CURVES
  - CANOPY-DEP-HARVARD-SNOW
  - CANOPY-DEP-MARCELL-SNOW
  - CANOPY-DEP-F4-DATA
  unit_ids: []
- id: CANOPY-METHOD-SYNTHESIS
  title: CAL-09 independent summary reconstruction
  owner: CAL-09 method steward
  description: Deterministically reconstruct all report headline quantities from retained CSV rows.
  procedure: Execute reproduce_canopy_synthesis.py and compare its complete JSON output byte-for-byte with the retained result.
  dependency_ids:
  - CANOPY-DEP-REPRODUCER
  - CANOPY-DEP-ACCEPTED
  - CANOPY-DEP-CONFIGURATIONS
  - CANOPY-DEP-HARVARD
  - CANOPY-DEP-RIDGE
  - CANOPY-DEP-GRADIENT
  - CANOPY-DEP-BEZA
  - CANOPY-DEP-ELLIOT
  unit_ids:
  - member_count
  - day
  - percent
  - pair_count
  - kg_m2
  - run_count
  - transition_count
  - target_count
  - degC
  - Pa
  - hour
