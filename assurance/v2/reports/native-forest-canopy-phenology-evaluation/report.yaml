units:
- id: member_count
  symbol: members
  quantity: Ensemble members
  definition: Exact count of retained coefficient configurations.
- id: day
  symbol: d
  quantity: Time
  definition: Calendar-day timing difference or aggregate error.
- id: percent
  symbol: "%"
  quantity: Fractional coverage
  definition: One hundred times a dimensionless fraction.
- id: pair_count
  symbol: pairs
  quantity: Source-rate pairs
  definition: Exact count of synthetic source-rate combinations.
- id: kg_m2
  symbol: kg m^-2
  quantity: Dry surface-residue stock
  definition: Dry mass per horizontal ground area.
- id: run_count
  symbol: runs
  quantity: Executed model runs
  definition: Exact count of prespecified executions.
- id: transition_count
  symbol: transition(s)
  quantity: Seasonal transition events
  definition: Count of same-direction threshold transitions.
- id: target_count
  symbol: targets
  quantity: Legacy comparison targets
  definition: Exact count of retained comparison rows.
- id: degC
  symbol: °C
  quantity: Temperature
  definition: Degrees Celsius.
- id: Pa
  symbol: Pa
  quantity: Vapor pressure deficit
  definition: Pascals.
- id: hour
  symbol: h
  quantity: Photoperiod
  definition: Hours of astronomical day length.
claims:
- id: CANOPY-C01
  title: Daily process-chain implementation
  owner: openWEPP plant-process owner
  statement: The tested implementation reconstructs GSI, foliar state, mass transfer, and same-day real-consumer chronology.
  claim_type: software_and_integration_verification
  scope_limit: Establishes tested implementation behavior, not general empirical accuracy.
  method_ids:
  - CANOPY-METHOD-VERIFICATION
  result_ids: []
  dependency_ids:
  - CANOPY-DEP-SC-PLANT
  - CANOPY-DEP-SC-RESIDUE
  - CANOPY-DEP-SC-MANAGEMENT
  unit_ids: []
  reference_ids:
  - CANOPY-REF-JOLLY
  - CANOPY-REF-ALLEN
  - CANOPY-REF-FLANAGAN
- id: CANOPY-C02
  title: Temperate timing calibration and transfer
  owner: CAL-04B scientific assessment owner
  statement: Hubbard calibration is partially identifiable and the retained ensemble transfers poorly to the Harvard holdout.
  claim_type: calibration_and_independent_evaluation
  scope_limit: Applies only to the retained Hubbard calibration and Harvard observations; no universal transfer claim.
  method_ids:
  - CANOPY-METHOD-TIMING
  result_ids:
  - CANOPY-RESULT-SYNTHESIS
  dependency_ids:
  - CANOPY-DEP-ACCEPTED
  - CANOPY-DEP-CONFIGURATIONS
  - CANOPY-DEP-HARVARD
  unit_ids:
  - member_count
  - day
  - percent
  - degC
  - Pa
  - hour
  reference_ids:
  - CANOPY-REF-JOLLY
- id: CANOPY-C03
  title: Litter source-decay identifiability
  owner: CAL-05 scientific assessment owner
  statement: Complete daily stock can identify the frozen synthetic source-rate truth, while one terminal stock cannot separately identify source and decay.
  claim_type: calibration_readiness
  scope_limit: Synthetic operator evidence only; no empirical forest decay value or predictive nonfoliar source law.
  method_ids:
  - CANOPY-METHOD-LITTER
  result_ids:
  - CANOPY-RESULT-SYNTHESIS
  dependency_ids:
  - CANOPY-DEP-RIDGE
  - CANOPY-DEP-SC-RESIDUE
  unit_ids:
  - pair_count
  - kg_m2
  reference_ids:
  - CANOPY-REF-LIM
  - CANOPY-REF-KEANE
  - CANOPY-REF-OLSON
  - CANOPY-REF-QUALLS
- id: CANOPY-C04
  title: Canopy-gradient congruence
  owner: CAL-06 scientific assessment owner
  statement: Winter canopy ordering is coherent across all accepted members in every source-supplied within-site forest gradient.
  claim_type: model_response_characterization
  scope_limit: Within-model ordering only; independent canopy-amplitude validation and downstream accuracy are not established.
  method_ids:
  - CANOPY-METHOD-GRADIENT
  result_ids:
  - CANOPY-RESULT-SYNTHESIS
  dependency_ids:
  - CANOPY-DEP-GRADIENT
  unit_ids:
  - member_count
  - run_count
  reference_ids:
  - CANOPY-REF-JOLLY
- id: CANOPY-C05
  title: Bezà tropical dry-forest chronology
  owner: CAL-07F scientific assessment owner
  statement: The retained GSI ensemble contradicts the assessed Bezà transition chronology under both camera-greenness products.
  claim_type: independent_empirical_evaluation
  scope_limit: Applies to the provisional 2024-2025 Bezà ROI record and current model structure; it does not establish replacement physics.
  method_ids:
  - CANOPY-METHOD-BEZA
  result_ids:
  - CANOPY-RESULT-SYNTHESIS
  dependency_ids:
  - CANOPY-DEP-BEZA
  unit_ids:
  - member_count
  - transition_count
  - day
  reference_ids:
  - CANOPY-REF-KEENAN
  - CANOPY-REF-RIVERA
  - CANOPY-REF-CHAPOTIN
  - CANOPY-REF-DONNELLY
  - CANOPY-REF-MENDEZ
- id: CANOPY-C06
  title: Elliot reproduction
  owner: CAL-02 scientific assessment owner
  statement: The authorized reconstruction does not reproduce most load-bearing Elliot numerical targets.
  claim_type: legacy_comparison
  scope_limit: The exact historical project is unavailable and legacy agreement is not correctness authority.
  method_ids:
  - CANOPY-METHOD-ELLIOT
  result_ids:
  - CANOPY-RESULT-SYNTHESIS
  dependency_ids:
