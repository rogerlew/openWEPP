reader_metadata:
  scientific_question: Does openWEPP's native-forest canopy formulation produce internally correct seasonal states, and where is that behavior corroborated, bounded, or contradicted by available evidence?
  assessed_process: Weather- and latitude-driven forest phenology, canopy state, litter transfer, surface residue, and downstream consumer response
  assessed_quantity: Daily GSI, foliage, LAI, canopy cover, litter and residue mass, transition timing, and bounded downstream responses
  realization: openWEPP native-forest evidence through CAL-07F at c42dde3136bbbf2b9c8a62ffe96ca6d28d77e615
  related_model_narrative: openwepp-canopy-phenology.md
  manuscript_date: "2026-07-29"
