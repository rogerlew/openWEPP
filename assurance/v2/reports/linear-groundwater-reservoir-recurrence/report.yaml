  owner: openWEPP groundwater process owner
  statement: The assessed implementation applies prior-day baseflow and deep-seepage exports before calculating current-day exports.
  claim_type: implementation_verification
  scope_limit: Exact tested recurrence and admitted coefficient domain.
  method_ids:
  - GW-METHOD-ANALYTICAL
  result_ids:
  - GW-RESULT-TWO-DAY
