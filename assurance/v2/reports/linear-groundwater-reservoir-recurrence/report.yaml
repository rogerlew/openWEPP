  title: Independent two-day recurrence calculation
  owner: openWEPP groundwater process owner
  description: Apply the published daily recurrence to a predeclared two-day vector using independent decimal and binary64 arithmetic, and separately execute the Rust assertion test.
  procedure: Preserve the independent arithmetic residual as reconstruction evidence; record the separate Rust test pass against its 1.0e-12 m3 assertion allowance without presenting that residual as an observed Rust-oracle delta.
  dependency_ids:
  - GW-DEP-SCIENCE-CONTRACT
  - GW-DEP-IMPLEMENTATION
  - GW-DEP-CURRENT-CONFIRMATION
  unit_ids:
  - m3
  - d_inv
- id: GW-METHOD-DOMAIN
  title: Coefficient-domain and over-export guard test
  owner: openWEPP groundwater process owner
  description: Check admitted nonnegative coefficients and fail-closed rejection when combined daily exports exceed accepted storage.
  procedure: Trace the science-contract domain and execute the retained over-export negative vector under the current-tree focused confirmation.
  dependency_ids:
  - GW-DEP-SCIENCE-CONTRACT
  - GW-DEP-IMPLEMENTATION
  - GW-DEP-CURRENT-CONFIRMATION
  unit_ids:
  - m3
  - d_inv
- id: GW-METHOD-LEDGER
  title: Independent terminal groundwater-ledger reconstruction
  owner: openWEPP integrated-validation owner
  description: Reconstruct pre-export and post-export terminal identities from retained H2637 operands.
  procedure: Use terminal-day rather than latest-event exports and compare both independently calculated residuals with stored storage-scaled allowances.
  dependency_ids:
  - GW-DEP-H2637-EVIDENCE
  - GW-DEP-H2637-ARITHMETIC
  unit_ids:
  - m3
- id: GW-METHOD-CONSUMER
  title: Groundwater writer/parser and consumer-interface inspection
  owner: openWEPP watershed integration owner
  description: Exercise the production HBP writer/parser and, separately, the generated-baseflow watershed consumer contract.
  procedure: Run focused interface tests, check enabling authority and area threshold behavior, prove generated groundwater is excluded from the surface-runoff source, and disclose that no single fresh payload traversed the actual adapter.
  dependency_ids:
  - GW-DEP-CURRENT-CONFIRMATION
  - GW-DEP-H2637-EVIDENCE
  - GW-DEP-CONSUMER-PROOF
  - GW-DEP-ROUTER-EXCLUSION-PROOF
  unit_ids:
  - m3
- id: GW-METHOD-CURRENCY
  title: Assessed-path realization freeze
  owner: ASSURE-05 package owner
  description: Bind exactly twelve declared implementation, publication, consumer, and test paths and compare them with the earlier integrated realization.
  procedure: Record path-level content digests and require an empty path-limited Git diff before fresh evidence acquisition.
  dependency_ids:
  - GW-DEP-ASSURE05-REALIZATION-FREEZE
  - GW-DEP-SOFTWARE
  unit_ids: []
- id: GW-METHOD-CURRENT-TESTS
  title: Focused frozen-realization groundwater confirmation
  owner: ASSURE-05 package owner
  description: Execute the named recurrence, guard, threshold, authority, hillslope-pass, and separate watershed-consumer contract tests selected before ASSURE-05 acquisition.
  procedure: Run the preregistered nextest quick expression and preserve the command, run identity, selected test names, pass count, skipped count, and frozen realization.
  dependency_ids:
  - GW-DEP-CURRENT-CONFIRMATION
  - GW-DEP-IMPLEMENTATION
  unit_ids: []
