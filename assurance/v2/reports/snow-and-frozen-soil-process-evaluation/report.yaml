methods:
- id: SF-METHOD-PHASE
  title: Jennings hourly precipitation-phase evaluation
  owner: openWEPP meteorology and snow-process owners
  description: Compare the active Harder-Pomeroy and fixed-threshold formulations against the same eligible, exclusive rain-or-snow hourly labels.
  procedure: Apply the content-identified eligibility and exclusion rules, reconstruct both accuracies from full integer confusion matrices, select per-station modeled transition events nearest one-half rain fraction, and compare lowest/highest mean-humidity station deciles separately.
  dependency_ids:
  - SF-DEP-JENNINGS-RESULT
  - SF-DEP-JENNINGS-PAPER
  - SF-DEP-JENNINGS-DATA
  - SF-DEP-HARDER
  - SF-DEP-JENNINGS-README
  - SF-DEP-JENNINGS-HARNESS
  unit_ids:
  - row_count
  - station_count
  - dimensionless
  - percent
  - percentage_point
  - degC
- id: SF-METHOD-SNOW
  title: Multi-timescale seasonal snow profile
  owner: openWEPP snow-process owner
  description: Evaluate SWE, depth, density, timing, and response signatures across five SNOTEL and five canopy surfaces using forcing-robust and forcing-limited roles.
  procedure: Preserve per-site paired counts, signature bands, density KGE, timing offsets, and depth-SWE slope ratios; classify fail cells by response family without treating correlated rubric cells as independent trials or a scalar accuracy score.
  dependency_ids:
  - SF-DEP-ACTIVATION
  - SF-DEP-RESIDUALS
  - SF-DEP-SNOTEL-README
  - SF-DEP-CANOPY-README
  - SF-DEP-CONTRACT
  unit_ids:
  - row_count
  - site_count
  - cell_count
  - percent
  - dimensionless
  - day
- id: SF-METHOD-FROST
  title: Method-specific frozen-soil observation comparison
  owner: openWEPP frozen-soil process owner
  description: Compare frost-tube magnitude residuals and soil-temperature zero-isotherm bounds while evaluating paired snow-depth control separately.
  procedure: Never pool frost-tube and isotherm referents; block frost-physics attribution when snow control fails or is unavailable.
  dependency_ids:
  - SF-DEP-FROST
  - SF-DEP-FROST-README
  - SF-DEP-DUN-2010
  - SF-DEP-SLEEPERS
  - SF-DEP-GGD498
  - SF-DEP-CONTRACT
  unit_ids:
  - row_count
  - site_count
  - m
  - percent
- id: SF-METHOD-CONSERVATION
  title: Production selector and water-ledger reconstruction
  owner: openWEPP integrated-validation owner
  description: Check active selector traces and independently reconstruct precipitation partition plus four selected snow and combined liquid/frozen soil-water rows from produced-output operands.
  procedure: Authenticate the exact source log, preserve row identities, operands, timing, and signs, reject physical depth as water storage, calculate residuals rather than replay them, and compare residuals with declared allowances and modeled storage/transfer magnitude.
  dependency_ids:
  - SF-DEP-ACTIVATION
  - SF-DEP-CONSERVATION
  - SF-DEP-CONSERVATION-INPUT
  - SF-DEP-CONSERVATION-LOG
  - SF-DEP-CONTRACT
  unit_ids:
  - row_count
  - m
  - mm
- id: SF-METHOD-SYNTHESIS
  title: Deterministic claim-specific evidence synthesis
  owner: ASSURE-06 package owner
  description: Reconstruct the compact strict result from content-identified evidence without choosing methods or interpreting conclusions.
  procedure: Execute the standard-library procedure, require exact parsed JSON equality with the retained result, and preserve every numerator, denominator, unit, and source digest.
  dependency_ids:
  - SF-DEP-REPRODUCTION
  - SF-DEP-CONSERVATION-INPUT
  - SF-DEP-CONSERVATION-LOG
  - SF-DEP-PROTOCOL
  - SF-DEP-INVENTORY
  - SF-DEP-SOFTWARE
  unit_ids:
  - row_count
  - station_count
  - site_count
  - cell_count
  - dimensionless
  - percent
  - percentage_point
  - degC
  - m
  - mm
  - day
