tables:
- id: SF-TABLE-PHASE
  title: Harder-Pomeroy hourly phase confusion matrix
  owner: openWEPP snow-process owner
  caption: Integer observed-versus-classified counts for the humidity-aware phase formulation across all retained scored rows.
  alternative_text: Most observed rain and snow rows are classified correctly; snow classified as rain is the larger error cell.
  row_header: Observed phase
  columns:
  - label: Classified rain
    unit_id: row_count
  - label: Classified snow
    unit_id: row_count
  rows:
  - label: Rain
    value_binding_ids:
    - SF-V-HP-RAIN-AS-RAIN
    - SF-V-HP-RAIN-AS-SNOW
  - label: Snow
    value_binding_ids:
    - SF-V-HP-SNOW-AS-RAIN
    - SF-V-HP-SNOW-AS-SNOW
- id: SF-TABLE-SNOW
  title: Forcing-robust seasonal snow response profile
  owner: openWEPP snow-process owner
  caption: Prespecified signature-band counts across the 90 available forcing-robust cells at ten snow comparison surfaces.
  alternative_text: Strong and pass cells are the majority; 15 cells fail and 14 are marginal.
  row_header: Signature band
  columns:
  - label: Cells
    unit_id: cell_count
  rows:
  - label: Fail
    value_binding_ids:
    - SF-V-SNOW-FAIL
  - label: Marginal
    value_binding_ids:
    - SF-V-SNOW-MARGINAL
  - label: Pass
    value_binding_ids:
    - SF-V-SNOW-PASS
  - label: Strong
    value_binding_ids:
    - SF-V-SNOW-STRONG
- id: SF-TABLE-FROST
  title: Frozen-soil comparison and snow-control counts
  owner: openWEPP frozen-soil process owner
  caption: Method-specific retained counts; frost-tube residuals and soil-temperature bounds are not pooled as equivalent depth measurements.
  alternative_text: The table shows 675 frost-tube residuals, 493 failed snow controls among 660 paired dates, and 3,556 zero-isotherm exceedances among 14,939 evaluated bounds.
  row_header: Quantity
  columns:
  - label: Rows
    unit_id: row_count
  rows:
  - label: Frost-tube matched residuals
    value_binding_ids:
    - SF-V-FROST-MATCHES
  - label: Paired snow-depth controls
    value_binding_ids:
    - SF-V-FROST-SNOW-ROWS
  - label: Failed snow-depth controls
    value_binding_ids:
    - SF-V-FROST-SNOW-FAILURES
  - label: Soil-temperature isotherm bounds
    value_binding_ids:
    - SF-V-ISOTHERM-ROWS
  - label: Soil-temperature isotherm exceedances
    value_binding_ids:
    - SF-V-ISOTHERM-EXCEEDANCES
- id: SF-TABLE-SNOW-SITES
  title: Site-resolved seasonal snow diagnostics
  owner: openWEPP snow-process owner
  caption: Site-level paired rows, correlated rubric-designated forcing-robust cell counts, and representative physical diagnostics. Offsets are modeled minus observed; slope ratio is modeled divided by observed.
  alternative_text: Ten sites show heterogeneous density, timing, and depth-SWE geometry responses; the rubric cells are correlated diagnostics, not independent trials.
  row_header: Comparison surface
  columns:
  - label: Paired rows
    unit_id: row_count
  - label: Fail cells
    unit_id: cell_count
  - label: Marginal cells
    unit_id: cell_count
  - label: Pass cells
    unit_id: cell_count
  - label: Strong cells
    unit_id: cell_count
  - label: Density KGE
    unit_id: dimensionless
  - label: Peak SWE offset
    unit_id: day
  - label: Meltout offset
    unit_id: day
  - label: Depth-SWE slope ratio
    unit_id: dimensionless
  rows:
  - label: Mica Creek
    value_binding_ids:
    - SF-V-SNOW-MICA-PAIRED
    - SF-V-SNOW-MICA-FAIL
    - SF-V-SNOW-MICA-MARGINAL
    - SF-V-SNOW-MICA-PASS
    - SF-V-SNOW-MICA-STRONG
