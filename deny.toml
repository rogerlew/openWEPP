# cargo-deny configuration.
# Enforces the openWEPP license posture: CC0-1.0 first-party, permissive deps only,
# no viral copyleft (GPL / AGPL / LGPL).

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]
# Notes:
# - GPL / AGPL / LGPL are denied by absence from the allow list.
# - MPL-2.0 (weak per-file copyleft) is not allow-listed by default.
#   Specific MPL-2.0 dependencies may be added with documented justification
#   via a per-crate exception once a real need arises.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
