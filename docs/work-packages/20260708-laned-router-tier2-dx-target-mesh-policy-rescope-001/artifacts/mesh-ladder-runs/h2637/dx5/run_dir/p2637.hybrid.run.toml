schema = "openwepp-hillslope-runfile-v1"
run_name = "h2637-laned-seam-active-suite"
unit_system = "metric"

[inputs]
soil = "p2637.sol"
management = "p2637.man"
slope = "p2637.slp"
climate = "p2637.cli"
wepp_ui = true
pmetpara = "pmetpara.txt"

[outputs]
pass = "output-hybrid/H2637.hbp"
loss = "output-hybrid/H2637.loss.json"
