<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence authority for candidate explanations of Bezà canopy chronology</title>
  <desc id="desc">A matrix places rainfall, forest-habitat chronology, temperature, vapor pressure deficit, photoperiod, stored plant water, and PhenoCam observation semantics against direct-site, Madagascar regional, and outside-region evidence. Rainfall, forest-type chronology contrast, and observation product identity have direct-site support. Other mechanisms are regional, analogue, unsupported, or unresolved.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="80" y="54" font-family="sans-serif" font-size="28" font-weight="700" fill="#17202a">What the literature can—and cannot—explain at Bezà</text>
  <text x="80" y="84" font-family="sans-serif" font-size="16" fill="#4d5656">Higher rows carry more site-specific authority; circles identify the strongest admitted evidence for each candidate.</text>

  <rect x="250" y="126" width="860" height="126" fill="#edf7ed"/>
  <rect x="250" y="252" width="860" height="126" fill="#fff7e6"/>
  <rect x="250" y="378" width="860" height="126" fill="#f4f2f8"/>
  <rect x="250" y="504" width="860" height="126" fill="#f6f6f6"/>

  <g stroke="#aeb6bf" stroke-width="1">
    <line x1="250" y1="126" x2="1110" y2="126"/>
    <line x1="250" y1="252" x2="1110" y2="252"/>
    <line x1="250" y1="378" x2="1110" y2="378"/>
    <line x1="250" y1="504" x2="1110" y2="504"/>
    <line x1="250" y1="630" x2="1110" y2="630"/>
  </g>

  <g font-family="sans-serif" fill="#273746">
    <text x="80" y="182" font-size="18" font-weight="700">Direct site</text>
    <text x="80" y="207" font-size="14">Bezà observations or product</text>
    <text x="80" y="308" font-size="18" font-weight="700">Madagascar region</text>
    <text x="80" y="333" font-size="14">Relevant, not transferable</text>
    <text x="80" y="434" font-size="18" font-weight="700">Biome analogue</text>
    <text x="80" y="459" font-size="14">Mechanism plausibility only</text>
    <text x="80" y="560" font-size="18" font-weight="700">Unresolved / absent</text>
    <text x="80" y="585" font-size="14">Needs measurement or acquisition</text>
  </g>

  <g font-family="sans-serif" font-size="15" font-weight="700" fill="#273746" text-anchor="middle">
    <text x="310" y="112">Rainfall</text>
    <text x="430" y="105">Forest habitat</text>
    <text x="430" y="122">chronology</text>
    <text x="550" y="112">Temperature</text>
    <text x="670" y="112">VPD</text>
    <text x="790" y="112">Photoperiod</text>
    <text x="910" y="105">Stored plant</text>
    <text x="910" y="122">water</text>
    <text x="1030" y="105">Observation</text>
    <text x="1030" y="122">semantics</text>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="310" cy="189" r="30" fill="#287d3c"/>
    <text x="310" y="180" font-size="11" font-weight="700" fill="#ffffff">SITE</text>
    <text x="310" y="194" font-size="11" font-weight="700" fill="#ffffff">SUPPORT</text>
    <text x="310" y="208" font-size="10" fill="#ffffff">S01</text>

    <circle cx="430" cy="189" r="30" fill="#a66b00"/>
    <text x="430" y="180" font-size="10" font-weight="700" fill="#ffffff">HABITAT</text>
    <text x="430" y="194" font-size="10" font-weight="700" fill="#ffffff">CONTRAST</text>
    <text x="430" y="208" font-size="10" fill="#ffffff">S01</text>

    <circle cx="550" cy="567" r="30" fill="#757575"/>
    <text x="550" y="558" font-size="10" font-weight="700" fill="#ffffff">NOT</text>
    <text x="550" y="572" font-size="10" fill="#ffffff">ISOLATED</text>
    <text x="550" y="586" font-size="9" fill="#ffffff">AT SITE</text>

    <circle cx="670" cy="567" r="30" fill="#757575"/>
    <text x="670" y="558" font-size="10" font-weight="700" fill="#ffffff">NOT</text>
    <text x="670" y="572" font-size="10" fill="#ffffff">MEASURED</text>
    <text x="670" y="586" font-size="9" fill="#ffffff">AT SITE</text>

    <circle cx="790" cy="441" r="30" fill="#6750a4"/>
    <text x="790" y="433" font-size="10" font-weight="700" fill="#ffffff">ANALOGUE</text>
    <text x="790" y="447" font-size="10" font-weight="700" fill="#ffffff">ONLY</text>
    <text x="790" y="461" font-size="10" fill="#ffffff">S09</text>

    <circle cx="910" cy="315" r="30" fill="#b26a00"/>
    <text x="910" y="311" font-size="12" font-weight="700" fill="#ffffff">SPECIES</text>
    <text x="910" y="328" font-size="12" fill="#ffffff">S04</text>

    <circle cx="1030" cy="189" r="30" fill="#1769aa"/>
    <text x="1030" y="185" font-size="12" font-weight="700" fill="#ffffff">PRODUCT</text>
    <text x="1030" y="202" font-size="12" fill="#ffffff">S15</text>

    <circle cx="310" cy="315" r="20" fill="#b26a00"/>
    <text x="310" y="320" font-size="11" fill="#ffffff">S03</text>
    <circle cx="790" cy="315" r="20" fill="#b26a00"/>
    <text x="790" y="320" font-size="11" fill="#ffffff">S03</text>
    <circle cx="430" cy="441" r="20" fill="#6750a4"/>
    <text x="430" y="446" font-size="11" fill="#ffffff">S10</text>
  </g>

  <g font-family="sans-serif" font-size="14" fill="#273746">
    <rect x="250" y="658" width="18" height="18" rx="9" fill="#287d3c"/>
    <text x="277" y="672">site-supported contributor</text>
    <rect x="490" y="658" width="18" height="18" rx="9" fill="#b26a00"/>
    <text x="517" y="672">regional contributor</text>
    <rect x="690" y="658" width="18" height="18" rx="9" fill="#6750a4"/>
    <text x="717" y="672">analogue plausibility</text>
    <rect x="875" y="658" width="18" height="18" rx="9" fill="#757575"/>
    <text x="902" y="672">unresolved at site</text>
  </g>
</svg>
