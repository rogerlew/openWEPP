schema = "openwepp-hillslope-runfile-v1"
run_name = "mn_corn_h4"
unit_system = "metric"

[inputs]
soil = "p4.sol"
management = "p4.man"
slope = "p4.slp"
climate = "p4.cli"
wepp_ui = true
pmetpara = "pmetpara.txt"

[outputs]
pass = "output-plain/H4.hbp"
loss = "output-plain/H4.loss.json"
pass_parquet = "output-plain/H4.pass.parquet"
wat = "output-plain/H4.wat.parquet"
