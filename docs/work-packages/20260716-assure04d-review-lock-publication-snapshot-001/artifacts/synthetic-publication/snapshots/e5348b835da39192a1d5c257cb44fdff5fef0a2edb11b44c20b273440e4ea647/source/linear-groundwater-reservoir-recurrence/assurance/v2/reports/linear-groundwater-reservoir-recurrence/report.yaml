claims:
  - id: GW-P01
    title: Authorized daily groundwater-reservoir formulation
    owner: openWEPP groundwater process owner
    statement: The authorized daily recurrence adds current recharge, debits prior-day exports, then computes current baseflow and deep seepage as proportional releases over a fixed one-day interval.
    claim_type: formulation_authority
    scope_limit: Linear daily routine only; later nonlinear groundwater formulations are excluded.
    method_ids: [GW-METHOD-AUTHORITY]
    result_ids: []
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-PRIEST-RIVER-STUDY]
    unit_ids: [m3, d_inv]
    reference_ids: [GW-REF-SCIENCE-CONTRACT, GW-REF-SRIVASTAVA-2013]
  - id: GW-P02
    title: Prior-day export timing
    owner: openWEPP groundwater process owner
    statement: The assessed implementation applies prior-day baseflow and deep-seepage exports before calculating current-day exports.
    claim_type: implementation_verification
    scope_limit: Exact tested recurrence and admitted coefficient domain.
    method_ids: [GW-METHOD-ANALYTICAL]
    result_ids: [GW-RESULT-TWO-DAY]
    dependency_ids: [GW-DEP-IMPLEMENTATION, GW-DEP-CURRENT-CONFIRMATION, GW-DEP-SOFTWARE]
    unit_ids: [m3, d_inv]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P03
    title: Two-day recurrence realization
    owner: openWEPP groundwater process owner
    statement: The analytical vector reproduces every independently calculated storage and export value within the coded implementation-test allowance.
    claim_type: implementation_verification
    scope_limit: Synthetic 1,000 m2 daily case; not field performance or numerical-convergence evidence.
    method_ids: [GW-METHOD-ANALYTICAL]
    result_ids: [GW-RESULT-TWO-DAY]
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-IMPLEMENTATION, GW-DEP-CURRENT-CONFIRMATION, GW-DEP-SOFTWARE]
    unit_ids: [m3, d_inv]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P04
    title: Coefficient domain and over-export guard
    owner: openWEPP groundwater process owner
    statement: Current authority admits finite nonnegative baseflow and deep-seepage coefficients and rejects a combined daily export that exceeds accepted storage; negative deep-seepage coefficients are outside authority.
    claim_type: domain_guard_verification
    scope_limit: No independent scientific upper bound is assigned to either coefficient; admissibility is recurrence- and timestep-specific.
    method_ids: [GW-METHOD-DOMAIN]
    result_ids: []
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-IMPLEMENTATION, GW-DEP-CURRENT-CONFIRMATION]
    unit_ids: [m3, d_inv]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P05
    title: Production groundwater-ledger reconstruction
    owner: openWEPP integrated-validation owner
    statement: The retained H2637 production case closes both terminal-storage identities within their storage-scaled allowances.
    claim_type: integrated_verification
    scope_limit: One retained multiyear, multi-OFE case; ledger closure is not observational accuracy or convergence evidence.
    method_ids: [GW-METHOD-LEDGER]
    result_ids: [GW-RESULT-H2637]
    dependency_ids: [GW-DEP-H2637-EVIDENCE, GW-DEP-H2637-ARITHMETIC, GW-DEP-SOFTWARE]
    unit_ids: [m3]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P06
    title: Production consumer continuity
    owner: openWEPP watershed integration owner
    statement: Generated baseflow and deep seepage traverse direct publication, hillslope-pass serialization and parsing, watershed contribution, and the generated-baseflow channel branch; cbase is not substituted when the linear reservoir is enabled.
    claim_type: consumer_path_verification
    scope_limit: Named tested publication and watershed branches only.
    method_ids: [GW-METHOD-CONSUMER]
    result_ids: []
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-H2637-EVIDENCE, GW-DEP-CONSUMER-PROOF, GW-DEP-SOFTWARE]
    unit_ids: [m3, d, ofe_count]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P07
    title: Active surface-router exclusion
    owner: openWEPP watershed integration owner
    statement: Generated groundwater is excluded from the active surface-runoff source builder and therefore does not reenter the tested surface router.
    claim_type: negative_consumer_path_verification
    scope_limit: Static source exclusion for the named active source builder; not a universal proof for future routers.
    method_ids: [GW-METHOD-CONSUMER]
    result_ids: []
    dependency_ids: [GW-DEP-ROUTER-EXCLUSION-PROOF, GW-DEP-SOFTWARE]
    unit_ids: [m3]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P08
    title: Frozen-to-intake path currency
    owner: ASSURE-02 package owner
    statement: Every declared groundwater implementation, publication, consumer, and test path was unchanged between the frozen assessed commit and ASSURE-02 intake.
    claim_type: static_currency_check
    scope_limit: The exact declared path set only; this does not substitute for fresh integrated release transfer.
    method_ids: [GW-METHOD-CURRENCY]
    result_ids: [GW-RESULT-PATH-CURRENCY]
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-SOFTWARE]
    unit_ids: [path_count]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
  - id: GW-P09
    title: Focused current-tree executable confirmation
    owner: ASSURE-02 package owner
    statement: Focused current-tree recurrence, guard, threshold, authority, and hillslope-pass consumer tests pass.
    claim_type: focused_executable_confirmation
    scope_limit: The focused selected tests; not a full workspace run or fresh H2637 execution.
    method_ids: [GW-METHOD-CURRENT-TESTS]
    result_ids: [GW-RESULT-FOCUSED-TESTS]
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-IMPLEMENTATION, GW-DEP-SOFTWARE]
    unit_ids: [test_count]
    reference_ids: [GW-REF-SCIENCE-CONTRACT]
methods:
  - id: GW-METHOD-AUTHORITY
    title: Formulation and authority traceability
    owner: openWEPP groundwater process owner
    description: Trace recurrence equations, interval, coefficient domain, and publication meanings to the canonical science contract and published formulation.
    procedure: Compare the manuscript formulation with SC-GWBASEFLOW-001 and the retained Srivastava et al. publication identity without treating coupled calibration statistics as current openWEPP results.
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-PRIEST-RIVER-STUDY]
    unit_ids: [m3, d_inv]
  - id: GW-METHOD-ANALYTICAL
    title: Independent two-day recurrence calculation
    owner: openWEPP groundwater process owner
    description: Apply the published daily recurrence to a predeclared two-day vector and compare every storage and export value.
    procedure: Compute expected values independently, execute the focused recurrence test, and compare absolute binary64 residuals with the coded 1.0e-12 m3 allowance.
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-IMPLEMENTATION, GW-DEP-CURRENT-CONFIRMATION]
    unit_ids: [m3, d_inv]
  - id: GW-METHOD-DOMAIN
    title: Coefficient-domain and over-export guard test
    owner: openWEPP groundwater process owner
    description: Check admitted nonnegative coefficients and fail-closed rejection when combined daily exports exceed accepted storage.
    procedure: Trace the science-contract domain and execute the retained over-export negative vector under the current-tree focused confirmation.
    dependency_ids: [GW-DEP-SCIENCE-CONTRACT, GW-DEP-IMPLEMENTATION, GW-DEP-CURRENT-CONFIRMATION]
    unit_ids: [m3, d_inv]
  - id: GW-METHOD-LEDGER
    title: Independent terminal groundwater-ledger reconstruction
    owner: openWEPP integrated-validation owner
    description: Reconstruct pre-export and post-export terminal identities from retained H2637 operands.
    procedure: Use terminal-day rather than latest-event exports and compare both independently calculated residuals with stored storage-scaled allowances.
    dependency_ids: [GW-DEP-H2637-EVIDENCE, GW-DEP-H2637-ARITHMETIC]
    unit_ids: [m3]
  - id: GW-METHOD-CONSUMER
    title: Groundwater publication and consumer-path inspection
    owner: openWEPP watershed integration owner
    description: Exercise and inspect the production chain from direct runtime through hillslope-pass publication to the generated-baseflow watershed branch.
    procedure: Run focused consumer tests, check enabling authority and area threshold behavior, and prove generated groundwater is excluded from the surface-runoff source.
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-H2637-EVIDENCE, GW-DEP-CONSUMER-PROOF, GW-DEP-ROUTER-EXCLUSION-PROOF]
    unit_ids: [m3]
  - id: GW-METHOD-CURRENCY
    title: Frozen-to-intake path comparison
    owner: ASSURE-02 package owner
    description: Compare exactly twelve declared implementation, publication, consumer, and test paths between the assessed commit and ASSURE-02 intake.
    procedure: Run the retained git diff path selection and require empty standard output with successful exit status.
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-SOFTWARE]
    unit_ids: []
  - id: GW-METHOD-CURRENT-TESTS
    title: Focused current-tree groundwater confirmation
    owner: ASSURE-02 package owner
    description: Execute the named recurrence, guard, threshold, authority, and hillslope-pass consumer tests selected by ASSURE-02.
    procedure: Run the retained nextest quick expression and preserve the run ID, selected test names, pass count, skipped count, and scope limitation.
    dependency_ids: [GW-DEP-CURRENT-CONFIRMATION, GW-DEP-IMPLEMENTATION]
    unit_ids: []
