<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 378">
  <title>H2637 groundwater-ledger residuals and allowances</title>
  <desc>Both residual bars are far shorter than their corresponding allowance bars; exact values appear in the visible data table.</desc>
  <defs>
    <pattern id="solid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d9d9d9"/></pattern>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="white"/><path d="M0,8 L8,0" stroke="#555" stroke-width="2"/></pattern>
  </defs>
  <rect width="900" height="378" fill="white"/>
  <text x="20" y="32" font-family="sans-serif" font-size="20">H2637 groundwater-ledger residuals and allowances</text>
  <text x="20" y="88" font-family="sans-serif" font-size="14">Recurrence residual magnitude</text>
  <rect x="300" y="70" width="0.168593" height="28" fill="url(#solid)" stroke="black"/>
  <text x="815" y="89" text-anchor="end" font-family="monospace" font-size="14">4.25e-11 m3</text>
  <text x="20" y="150" font-family="sans-serif" font-size="14">Recurrence allowance</text>
  <rect x="300" y="132" width="500.000000" height="28" fill="url(#stripe)" stroke="black"/>
  <text x="815" y="151" text-anchor="end" font-family="monospace" font-size="14">1.26e-07 m3</text>
  <text x="20" y="212" font-family="sans-serif" font-size="14">Post-export residual magnitude</text>
  <rect x="300" y="194" width="0.168650" height="28" fill="url(#solid)" stroke="black"/>
  <text x="815" y="213" text-anchor="end" font-family="monospace" font-size="14">4.25e-11 m3</text>
  <text x="20" y="274" font-family="sans-serif" font-size="14">Post-export allowance</text>
  <rect x="300" y="256" width="480.000000" height="28" fill="url(#stripe)" stroke="black"/>
  <text x="815" y="275" text-anchor="end" font-family="monospace" font-size="14">1.21e-07 m3</text>
</svg>
