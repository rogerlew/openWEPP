<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">CAL-05 source and decay equifinality ridge</title>
<desc id="desc">Two-panel figure. The left panel plots five increasing annual litter input and decay-rate pairs. The right panel shows their distinct annual stock trajectories converging to the same year-twenty stock.</desc>
